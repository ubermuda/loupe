# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(default:app.trusted_proxies_default:TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-port', 'x-forwarded-proto', 'x-forwarded-prefix']

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # Postgres rather than native files in the cache directory. The cache
        # directory is container-local, so every deploy logged every user out,
        # and with more than one web replica a session only existed on the
        # replica that created it.
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            # SubmitReviewHandler publishes to the hub inline, before the visitor's
            # response, so a hung hub would add its full timeout to every review
            # submit. symfony/mercure-bundle exposes no per-hub http_client option,
            # so MercureHubTimeoutPass swaps this in on the hub service instead.
            # timeout is the idle timeout, max_duration the whole exchange.
            mercure.hub_client:
                base_uri: '%env(MERCURE_URL)%'
                timeout: 2
                max_duration: 5

            # The About page's opt-in update check, which runs inline while the
            # page renders. Bounded hard for the same reason as the hub above: a
            # slow GitHub must not become a slow Loupe.
            github.api_client:
                base_uri: 'https://api.github.com'
                timeout: 2
                max_duration: 5
                headers:
                    Accept: 'application/vnd.github+json'

    rate_limiter:
        resend_verification_email:
            policy: fixed_window
            limit: 1
            interval: '60 seconds'
        registration:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
        password_reset_request:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        # Password-confirmation attempts on the social-account link page. This is
        # an online password guessing surface, so keep it tight.
        oauth_link:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        waitlist_join:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

# The e2e suite runs against the dev app from a single IP; production limits
# would throttle the suite itself. Keep dev effectively unlimited.
when@dev:
    framework:
        rate_limiter:
            resend_verification_email:
                policy: fixed_window
                limit: 1000
                interval: '60 seconds'
            registration:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
            password_reset_request:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
            oauth_link:
                policy: fixed_window
                limit: 1000
                interval: '15 minutes'
            waitlist_join:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # High limits so the suite is never throttled; throttling itself is
        # tested by overriding the limiter service with a low-limit factory.
        rate_limiter:
            resend_verification_email:
                policy: fixed_window
                limit: 1000
                interval: '60 seconds'
            registration:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
            password_reset_request:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
            oauth_link:
                policy: fixed_window
                limit: 1000
                interval: '15 minutes'
            waitlist_join:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
