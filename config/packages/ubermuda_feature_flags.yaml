ubermuda_feature_flags:
    # Directories the "scan for undefined flags" admin page walks looking for
    # flag names referenced in code but not defined in the database.
    scan:
        paths:
            - '%kernel.project_dir%/templates'
            - '%kernel.project_dir%/src'

    # Environment a feature needs before it can work at all. While any of these
    # is unset or blank the flag reads as off whatever is stored, and the admin
    # shows it as unavailable instead of a switch that cannot work.
    prerequisites:
        # Both flags need a hub: nothing to publish to and no token to sign without one.
        # MERCURE_JWT_SECRET ships with no default on purpose, so an unconfigured
        # instance has both off rather than failing on a submit or a page load.
        # MERCURE_PUBLIC_URL too: blank, a browser or the bridge gets an unusable hub URL.
        agent.push.enabled: ['MERCURE_URL', 'MERCURE_PUBLIC_URL', 'MERCURE_JWT_SECRET']
        live_updates.enabled: ['MERCURE_URL', 'MERCURE_PUBLIC_URL', 'MERCURE_JWT_SECRET']
