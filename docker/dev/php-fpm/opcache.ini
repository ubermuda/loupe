; Dev opcache sizing. One php-fpm serves the main checkout, every worktree and
; the e2e sidecar, so the cache holds roughly 18k PHP files per checkout. The
; file cap is what binds: opcache does not evict when the key table fills, it
; stops caching, so whichever files got in first stay and the rest recompile on
; every request for ever. Both caps are sized for the same ~6 checkouts, so
; neither is meant to be reached; past that, memory runs out before keys do.
opcache.memory_consumption=2048
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=262237
opcache.validate_timestamps=1

; A file costs about 1.65 keys, because a key is a path rather than a file, so
; six checkouts of ~18k files need about 178k keys and about 1.9GB. PHP rounds
; this setting to a fixed prime tier (65407/130987/262237), so pass the exact
; prime: 130987 would hold only about 4.4 checkouts and saturate again.

; Same cause, different cache: six deep vendor trees on Docker Desktop's
; filesystem layer blow through the 4M realpath default, and a realpath miss is
; the slowest thing that layer does. This one is per worker process, not shared.
realpath_cache_size=16M
realpath_cache_ttl=600
