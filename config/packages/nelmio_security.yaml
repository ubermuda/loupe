# NelmioSecurityBundle is registered in every environment (config/bundles.php),
# but only prod configures anything that produces a header. Dev and test enable
# the `csp` node and nothing else: that node is what registers the `csp_nonce()`
# Twig function, and base.html.twig calls it on every page. With no directives
# configured there is no policy to send, so dev and test still ship no security
# headers at all — the bundle is present purely to make the function exist.
when@dev: &nonce_only
    nelmio_security:
        csp:
            enabled: true

when@test: *nonce_only

when@prod:
    nelmio_security:
        # X-Frame-Options: SAMEORIGIN — allow framing only by our own origin.
        clickjacking:
            paths:
                '^/.*': SAMEORIGIN

        # X-Content-Type-Options: nosniff
        content_type:
            nosniff: true

        # Referrer-Policy: strict-origin-when-cross-origin
        referrer_policy:
            enabled: true
            policies:
                - 'strict-origin-when-cross-origin'

        # Content-Security-Policy is sent in REPORT-ONLY mode for now (the `report`
        # key, not `enforce`), so it blocks nothing.
        #
        # Nothing collects the violations either: no `report-uri`/`report-to` is set
        # and the bundle ships no route for its reporting controller, so reports
        # reach only the visitor's browser console. Collecting them would mean a
        # public unauthenticated POST endpoint — firewall access, paywall exemption,
        # CSRF exemption and a rate limit — which is a deliberate decision, not a
        # config line. Until it is taken, do not read this policy as validated
        # against real traffic: it has never been measured against any.
        csp:
            # CSP only makes sense on HTML documents; skip assets, JSON, downloads.
            content_types: ['text/html']
            # Standard header only — skip the legacy X-Content-Security-Policy /
            # X-WebKit-CSP variants (and the per-request User-Agent parsing they need).
            compat_headers: false
            report:
                default-src: ["'self'"]
                base-uri: ["'self'"]
                object-src: ["'none'"]
                frame-ancestors: ["'self'"]
                script-src: ["'self'", "'unsafe-inline'"]
                # Fonts are self-hosted (assets/fonts, SIL OFL) — no external
                # font or stylesheet origins are needed.
                style-src: ["'self'", "'unsafe-inline'"]
                font-src: ["'self'"]
                img-src: ["'self'", 'data:', 'https:']
                connect-src: ["'self'"]
