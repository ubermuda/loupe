name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is not set. Define it in .env — it must be unique per project. Two projects sharing a compose project name silently share containers and the database volume.}

services:
  nginx:
    # Pinned to a minor version: the bare `nginx` tag moves with every mainline
    # release, so an unpinned stack silently changes web server under you between
    # two `docker compose pull`s. 1.31 is nginx mainline, which is what the bare
    # tag resolved to when this was pinned.
    image: nginx:1.31
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/common/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # default.conf includes /etc/nginx/docroot.conf — nginx will not start
      # without it. docker/compose/worktree.yaml mounts a per-worktree file here.
      - ./docker/common/nginx/docroot-main.conf:/etc/nginx/docroot.conf
      # default.conf also includes /etc/nginx/app-env.conf. The main stack has
      # no overrides, so it gets the empty file; docker/compose/e2e.yaml mounts a
      # generated one to redirect the app at a disposable database.
      - ./docker/common/nginx/app-env-none.conf:/etc/nginx/app-env.conf
    depends_on:
      - php-fpm
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.dev.localhost`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=stepca
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
      # Tunnel ingress (ngrok reserved domain). The agent forwards to
      # https://localhost with the tunnel Host header preserved, so traefik
      # needs a router for it; Symfony then generates tunnel-host URLs
      # (OAuth callbacks, absolute links) automatically when browsed via the
      # tunnel. Override with TUNNEL_HOST in the shell environment.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-tunnel.rule=Host(`${TUNNEL_HOST:-tunnel.invalid}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-tunnel.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-tunnel.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-tunnel.service=${COMPOSE_PROJECT_NAME}

  php-fpm:
    build:
      dockerfile: ./docker/dev/php-fpm/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      XDEBUG_MODE: "develop,coverage"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
      # The admin e2e spec logs in as this address; PromoteAdminUserListener
      # grants it ROLE_ADMIN on login. Dev-only file — production is untouched.
      ADMIN_EMAIL: "e2e-admin-smoke@example.com"
      # composer needs authenticated GitHub API access for the VCS-sourced
      # ubermuda/* packages once the anonymous 60/hr limit is exhausted.
      # Export COMPOSER_AUTH on the HOST (never commit a token), e.g.:
      #   export COMPOSER_AUTH='{"github-oauth":{"github.com":"<token>"}}'
      # Empty when unset — composer then just uses anonymous access.
      COMPOSER_AUTH: "${COMPOSER_AUTH:-}"
    depends_on:
      - database

  # Consumes the doctrine `async` Messenger transport (data-export generation
  # today). Shares php-fpm's build context/image — no separate Dockerfile.
  worker:
    build:
      dockerfile: ./docker/dev/php-fpm/Dockerfile
    restart: unless-stopped
    # scheduler_default listed first deliberately — a deep async backlog must
    # not delay schedule ticks.
    command: php bin/console messenger:consume scheduler_default async --time-limit=3600 --memory-limit=128M
    volumes:
      - .:/var/www/html
    environment:
      XDEBUG_MODE: "off"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      - database
      - mailer

###> symfony/mailer ###
  # mailpit is reached via traefik at mailpit.${COMPOSE_PROJECT_NAME}.dev.localhost
  # (the e2e suite uses that URL); no host port is published.
  mailer:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit-${COMPOSE_PROJECT_NAME}.rule=Host(`mailpit.${COMPOSE_PROJECT_NAME}.dev.localhost`)
      - traefik.http.routers.mailpit-${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.mailpit-${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.mailpit-${COMPOSE_PROJECT_NAME}.tls.certresolver=stepca
      - traefik.http.services.mailpit-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8025
###< symfony/mailer ###

###> symfony/mercure-bundle ###
  # In-memory Mercure hub (no history — best-effort by design), opt-in via
  # `just mercure-up`. A missing hub only delays delivery — submissions reach the
  # outbox first and the scheduled drain replays them — so e2e passes without it.
  mercure:
    image: dunglas/mercure:v0.24
    profiles: ["mercure"]
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET:-ChangeThisMercureDevSecretChangeThisMercureDev}'
      MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET:-ChangeThisMercureDevSecretChangeThisMercureDev}'
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.mercure-${COMPOSE_PROJECT_NAME}.rule=Host(`mercure.${COMPOSE_PROJECT_NAME}.dev.localhost`)
      - traefik.http.routers.mercure-${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.mercure-${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.mercure-${COMPOSE_PROJECT_NAME}.tls.certresolver=stepca
      - traefik.http.services.mercure-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.pg-${COMPOSE_PROJECT_NAME}.rule=HostSNI(`db.${COMPOSE_PROJECT_NAME}.dev.localhost`)
      - traefik.tcp.routers.pg-${COMPOSE_PROJECT_NAME}.entrypoints=postgres
      - traefik.tcp.routers.pg-${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.tcp.routers.pg-${COMPOSE_PROJECT_NAME}.tls.certresolver=stepca
      - traefik.tcp.services.pg-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=5432
###< doctrine/doctrine-bundle ###

  # Opt-in S3-compatible storage for exercising EXPORT_STORAGE=s3 locally, behind
  # a compose profile. Start it with `just garage-up`, which also creates the
  # bucket and its access key. Not reachable through Traefik
  # at http://garage:3900, which is the only access anything here needs.
  garage:
    image: dxflrs/garage:v1.0.1
    profiles: ["garage"]
    volumes:
      - ./docker/dev/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta:rw
      - garage_data:/var/lib/garage/data:rw
    networks:
      - default

networks:
  traefik:
    external: true

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  garage_meta:
  garage_data:
