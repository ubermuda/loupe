# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            - resend-verification
            - revoke-api-token
            - submit-review
            - comment-action
            - mint-site-token
            - mint-project-mcp-token
            - site-review-comment-action
            - billing-checkout
            - billing-portal
