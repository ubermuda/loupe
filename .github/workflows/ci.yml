name: CI

on:
  pull_request:
  push:
    branches: [main]

# Deliberately not path-filtered, unlike the docs deploy. These are required
# checks: a filtered check never reports on a pull request it skipped, and a
# pull request waiting for a report that will never arrive cannot be merged at
# all. The local documentation-only carve-out in AGENTS.md is about a human
# waiting four minutes, which is not a cost a runner pays.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Five of the dependencies are VCS-sourced from github.com, and anonymous
  # composer gets 60 API requests an hour across the whole runner fleet.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

permissions:
  contents: read
  packages: read

# One job per leg of `just ci`, rather than one job running it. A single job
# reports a single check, so a red build names the branch and nothing else —
# split, the failure names itself in the checks list and branch protection can
# require the legs individually. Each job runs the same recipe a workstation
# runs, so the two gates cannot drift.
jobs:
  # Pushes the php-fpm image that the setup action pulls. A same-repository
  # branch publishes too, so a branch that changes the Dockerfile fills the
  # registry for its own re-runs. No job waits for it.
  php-fpm-image:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Name the image
        id: image
        run: |
          hash=$( { date -u +%G-%V; cat docker/dev/php-fpm/Dockerfile docker/dev/php-fpm/*.conf docker/dev/php-fpm/*.ini; } | sha256sum | cut -c1-16)
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$repo/php-fpm:$hash" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Look for the image
        id: exists
        run: |
          if docker manifest inspect "${{ steps.image.outputs.image }}" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.exists.outputs.found != 'true'
        id: buildx-mirror
        continue-on-error: true
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - if: steps.exists.outputs.found != 'true' && steps.buildx-mirror.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev/php-fpm/Dockerfile
          tags: ${{ steps.image.outputs.image }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      - run: just lint

      # A matrix leg the ruleset does not name can fail and still merge.
      - name: Every e2e leg is a required check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          required=$(gh api repos/${{ github.repository }}/rules/branches/main \
            --jq '.[]|select(.type=="required_status_checks")|.parameters.required_status_checks[].context')
          legs=$(awk '/^  e2e-shard:/{j=1} j&&/include:/{i=1} j&&/^    steps:/{exit} i&&/- name:/{print "e2e-" $3}' .github/workflows/ci.yml)
          [ -n "$legs" ] || { echo "::error::No e2e legs found in ci.yml."; exit 1; }
          missing=0
          for leg in $legs; do
            grep -qxF "$leg" <<<"$required" && continue
            echo "::error::$leg is not a required check. Add it to the main ruleset."
            missing=1
          done
          exit $missing

  cs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just cs-check

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          docker: 'true'
      - run: just phpstan

  arkitect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just arkitect

  gamache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just gamache

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
          docker: 'true'
      - run: just audit

  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          docker: 'true'

      # The flag rides the invocation, not the `phpunit` recipe, so a
      # workstation run still writes nothing. ParaTest creates the directory.
      - run: just phpunit --log-junit var/phpunit-timing/junit.xml
        timeout-minutes: 10

      - name: phpunit timing
        if: always() && hashFiles('var/phpunit-timing/junit.xml') != ''
        run: php bin/phpunit-timing.php var/phpunit-timing/junit.xml

      # Every run, green or red. Read it with `just ci-report phpunit-timing`.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpunit-timing
          path: var/phpunit-timing/junit.xml
          retention-days: 30
          if-no-files-found: warn

  # Node alone: vitest runs the browser code as source, with no container and
  # no database behind it.
  js-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      - run: just js-test

  # The Go CLI needs neither PHP nor the project's dependencies, so this leg
  # skips the setup action and takes just alone; the recipe brings its own
  # toolchain in a container.
  cli-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/docker-mirror
        with:
          images: golang:1.26-alpine
      - run: just cli-test

  # Eight runners, each with its own stack, database and seed. Six legs split
  # `chromium` per test. `rest` holds admin and the destructive chain, which
  # has to stay in one runner's order, and `global-flags` runs alone. Each leg
  # is a required check under its own name, so a new leg needs a ruleset edit.
  e2e-shard:
    name: e2e-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Every leg reports, so one red shard still leaves the others' timing
      # and Playwright report to read.
      fail-fast: false
      matrix:
        # `--shard` splits `chromium` per test. It cannot split `rest`, where
        # every project is a dependency of another, so `rest` and
        # `global-flags` each run whole.
        include:
          - name: chromium
            shard: chromium
            split: '--shard=1/6'
          - name: chromium-2
            shard: chromium
            split: '--shard=2/6'
          - name: chromium-3
            shard: chromium
            split: '--shard=3/6'
          - name: chromium-4
            shard: chromium
            split: '--shard=4/6'
          - name: chromium-5
            shard: chromium
            split: '--shard=5/6'
          - name: chromium-6
            shard: chromium
            split: '--shard=6/6'
          - name: rest
            shard: rest
            split: ''
          - name: global-flags
            shard: global-flags
            split: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
          docker: 'true'

      # By name, not a bare `up`: the `tailwind` service is a watcher, and it
      # would race the stylesheet build in the setup action. The worker is not
      # needed either — every message dispatched under the X-Playwright header
      # is handled inline.
      - run: >
          docker compose -f compose.yaml -f docker/compose/ci.yaml
          up -d --wait nginx mailer mercure

      - name: Prepare the application
        run: |
          docker compose exec -T php-fpm bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          docker compose exec -T php-fpm bin/console league:oauth2-server:generate-keypair --skip-if-exists
          docker compose exec -T php-fpm bin/console app:dev:seed

      # Everything above runs as root in the container; php-fpm serves requests
      # as www-data, and var/ is owned by the runner. Without this the first
      # request that writes a log line dies on a 500 instead — three specs deep
      # into the suite, where it reads as an application bug.
      - name: Let php-fpm write to var/
        run: |
          mkdir -p var/log
          sudo chmod -R a+rwX var

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # No --with-deps: the runner image already has every library Chromium
      # needs, and apt only added fallback fonts from a mirror that can stall.
      # A missing library fails the first launch with Playwright's own list.
      - run: npx playwright install chromium
        working-directory: e2e
        timeout-minutes: 5

      # The runner's whole database is disposable, so the suite runs against the
      # main stack rather than the `just e2e-up` sidecar, whose only purpose is
      # to keep a developer's own database out of the way. Playwright splits
      # `chromium` per test, and a file that opts out of parallel mode stays on
      # one runner. An empty `split` runs the whole shard.
      - run: just e2e ${{ matrix.split }}
        timeout-minutes: 25
        env:
          E2E_BASE_URL: http://localhost
          MAILPIT_URL: http://localhost:8025
          E2E_SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/var/e2e-timing/results.json

      - name: e2e timing
        if: always() && hashFiles('var/e2e-timing/results.json') != ''
        run: node bin/e2e-timing.mjs var/e2e-timing/results.json

      # Every run, green or red, one artifact per shard. Read them together
      # with `just ci-report e2e-timing`.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-timing-${{ matrix.name }}
          path: var/e2e-timing/results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Application errors
        if: failure()
        run: docker compose exec -T php-fpm sh -c 'grep -hE "CRITICAL|ERROR" var/log/dev.log | tail -n 40'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: e2e/playwright-report
          retention-days: 7
