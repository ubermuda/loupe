; Production opcache + preload tuning.
; Preload runs at php-fpm startup as www-data (the FPM run user on alpine).
; The path must match the image WORKDIR (/var/www/html).
opcache.enable=1
opcache.enable_cli=0
opcache.preload=/var/www/html/config/preload.php
opcache.preload_user=www-data
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Code never changes inside an immutable prod image — skip timestamp checks.
opcache.validate_timestamps=0
