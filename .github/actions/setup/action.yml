name: Set up the project
description: PHP, just, and the project's dependencies — plus Node and the Docker stack for the legs that need them.

inputs:
  node:
    description: Install Node and the npm dependencies.
    default: 'false'
  docker:
    description: Bring up the php-fpm and database containers and build the stylesheet.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: ctype, iconv, intl, pdo_pgsql, zip, bcmath, xsl
        coverage: none

    - uses: extractions/setup-just@v4

    - uses: actions/cache@v6
      with:
        path: vendor
        key: vendor-${{ hashFiles('composer.lock') }}

    # On a workstation composer runs in the container, because the host is a Mac
    # with a different PHP. Here the runner is pinned to the same 8.5 and the same
    # extension set, and the container bind-mounts this checkout, so one install
    # on the host serves every leg — including the ones that need no container
    # at all. twig.yaml registers var/tailwind as a template path, and the
    # post-install cache:clear refuses to run without it.
    - name: Install PHP dependencies
      shell: bash
      run: |
        mkdir -p var/tailwind
        composer install --no-interaction --no-progress

    - if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          e2e/package-lock.json

    - if: inputs.node == 'true'
      shell: bash
      run: |
        npm ci
        npm ci --prefix e2e

    - if: inputs.docker == 'true'
      uses: docker/setup-buildx-action@v4

    # Compose builds a service's image only when it is absent, so a build tagged
    # with the name compose expects is the image `up` then finds. Ask compose for
    # the name, because it derives from COMPOSE_PROJECT_NAME. `--images php-fpm`
    # also prints the images php-fpm depends on, so take the one named after the
    # service, and refuse any other count.
    - if: inputs.docker == 'true'
      id: php-fpm-image
      shell: bash
      run: |
        tag=$(docker compose config --images php-fpm | grep -E -- '-php-fpm$')
        echo "php-fpm image name: $tag"
        test "$(printf '%s\n' "$tag" | grep -c .)" = 1
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - if: inputs.docker == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/dev/php-fpm/Dockerfile
        tags: ${{ steps.php-fpm-image.outputs.tag }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # compose.yaml attaches to a traefik network that a workstation shares with a
    # long-running proxy. Nothing routes through it here; it only has to exist, or
    # every service referencing it fails to start.
    - if: inputs.docker == 'true'
      shell: bash
      run: |
        docker network create traefik
        docker compose up -d --wait database php-fpm

    # WebTestCase renders real templates, and layout_base.html.twig resolves the
    # compiled stylesheet through AssetMapper. The dev stack has a watcher
    # producing it; here it takes one explicit build.
    - if: inputs.docker == 'true'
      shell: bash
      run: docker compose exec -T php-fpm bin/console tailwind:build
