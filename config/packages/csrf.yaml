# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            - resend-verification
            - accept-terms
            - revoke-connected-app
            - submit-review
            - section-approval
            - comment-action
            - toggle-project-widget-forwarding
            - github-hook-create
            - github-hook-secret-rotate
            - forge-repository-remove
            - site-review-comment-action
            - board-card-delete
            - board-column-terminal
            - billing-checkout
            - billing-portal
            - wizard-skip
            - wizard-finish
            - request-data-export
            - request-account-deletion
            - confirm-account-deletion
            - admin-waitlist-invite
            - admin-user-suspend
            - admin-user-unsuspend
            - admin-user-delete
            - admin-user-resend-verification
            - billing-comp-grant
            - billing-comp-revoke
