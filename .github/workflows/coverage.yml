name: Coverage report

on:
  schedule:
    # Mondays, 03:00 UTC, an hour before the mutation run. A schedule fires from
    # the default branch only, so this first runs after the branch merges.
    - cron: '0 3 * * 1'
  workflow_dispatch:
  # TEMPORARY, removed before merge. workflow_dispatch is registered from the
  # default branch only, so this is the one way to measure a run on a runner.
  push:
    branches: [tooling/scoped-mutation-testing]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

# Two jobs rather than two steps. They measure different suites and write to
# different trees, and separate runners make a shared database impossible rather
# than merely sequential. The cost is a second stack build, which is the cheaper
# half of either job.
jobs:
  phpunit:
    runs-on: ubuntu-latest
    # A measured run took 4m 50s.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Runner conditions
        run: |
          nproc
          date -u +'stack build starts %H:%M:%S UTC'

      - uses: ./.github/actions/setup
        with:
          docker: 'true'

      - run: date -u +'stack build ends %H:%M:%S UTC'

      # Writes var/phpunit-coverage. Never var/coverage, which the e2e job below
      # deletes at the start of its own run.
      - run: just phpunit-coverage

      - name: Coverage summary
        if: always()
        run: head -12 var/phpunit-coverage/summary.txt || echo "no summary written"

      - name: PHPUnit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: |
            var/phpunit-coverage/summary.txt
            var/phpunit-coverage/clover.xml
            var/phpunit-coverage/html
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    # A page render costs about 4.7s under coverage against about 0.5s without,
    # so this job is long by nature. Re-size it from a passing run.
    timeout-minutes: 120
    # ci.yaml pins XDEBUG_MODE to off, because a normal CI run reads no coverage
    # and pays double for it. This job is the one that does read it.
    env:
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
          docker: 'true'

      - name: Runner conditions
        run: |
          nproc
          date -u +'e2e stack starts %H:%M:%S UTC'

      - run: >
          docker compose -f compose.yaml -f docker/compose/ci.yaml
          up -d --wait nginx mailer

      - name: Prepare the application
        run: |
          docker compose exec -T php-fpm bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          docker compose exec -T php-fpm bin/console app:dev:seed

      # CoverageSubscriber writes .cov files into var/ as www-data, and the
      # runner owns var/. Without this the first write fails mid-suite.
      - name: Let php-fpm write to var/
        run: |
          mkdir -p var/log
          sudo chmod -R a+rwX var

      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      - run: date -u +'e2e run starts %H:%M:%S UTC'

      # A silent 'off' collects nothing and still produces an empty report,
      # which reads as zero coverage. Read getenv, not ini_get: xdebug honours
      # the environment variable and ini_get keeps reporting the ini file.
      - name: Confirm the coverage driver is live
        run: |
          mode=$(docker compose exec -T php-fpm php -r 'echo getenv("XDEBUG_MODE");')
          echo "XDEBUG_MODE=$mode"
          case "$mode" in *coverage*) ;; *) echo 'coverage is off; the report would be empty'; exit 1 ;; esac

      - run: just e2e-coverage
        env:
          E2E_BASE_URL: http://localhost
          MAILPIT_URL: http://localhost:8025

      - name: Coverage summary
        if: always()
        run: head -12 var/coverage/summary.txt || echo 'no summary written'

      - name: e2e coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: |
            var/coverage/summary.txt
            var/coverage/clover.xml
            var/coverage/html
          if-no-files-found: warn
