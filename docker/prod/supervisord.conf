[supervisord]
nodaemon=true                ; keep Supervisor in foreground (PID 1)
loglevel=info
logfile_maxbytes=0             ; disable rotation

[program:php-fpm]
command          = /usr/local/sbin/php-fpm --nodaemonize
autorestart      = true
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0      ; ← disable rotation
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0      ; ← avoid stale settings
stderr_logfile_backups  = 0

[program:nginx]
command          = /usr/sbin/nginx -g 'daemon off; error_log /dev/stderr info;'
autorestart      = true
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0

[program:messenger-worker]
; scheduler_default listed first deliberately — a deep async backlog must not
; delay schedule ticks.
command          = php /var/www/html/bin/console messenger:consume scheduler_default async --time-limit=3600 --memory-limit=128M
user             = www-data           ; php-fpm workers run as www-data — archives must be readable by both
autorestart      = true               ; worker exits hourly (--time-limit); supervisor restarts it
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0

[program:export-purge]
; No cron daemon in this image — a supervised sleep loop is the backstop for
; the worker's opportunistic purge (see GenerateDataExportHandler), so an
; expired export's archive is still deleted even on an installation quiet
; enough that no later export ever completes to trigger it.
command          = bash -c 'while true; do php /var/www/html/bin/console app:purge-expired-exports; sleep 3600; done'
user             = www-data
autorestart      = true
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0
