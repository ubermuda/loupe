framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Module\Account\Messenger\GenerateDataExportMessage: async
            App\Module\Billing\Messenger\CancelSubscriptionMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

when@test:
    framework:
        messenger:
            transports:
                async:
                    dsn: 'in-memory://'
                    retry_strategy:
                        # Same retry budget as prod so retry-flow tests exercise
                        # the real number of attempts; zero delay so the
                        # in-memory transport releases retries immediately.
                        max_retries: 3
                        multiplier: 2
                        delay: 0
