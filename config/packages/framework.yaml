# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: 'PRIVATE_SUBNETS'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-port', 'x-forwarded-proto', 'x-forwarded-prefix']

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    #esi: true
    #fragments: true

    rate_limiter:
        resend_verification_email:
            policy: fixed_window
            limit: 1
            interval: '60 seconds'
        registration:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
        password_reset_request:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        # Password-confirmation attempts on the social-account link page. This is
        # an online password guessing surface, so keep it tight.
        oauth_link:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        waitlist_join:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

# The e2e suite runs against the dev app from a single IP; production limits
# would throttle the suite itself. Keep dev effectively unlimited.
when@dev:
    framework:
        rate_limiter:
            resend_verification_email:
                policy: fixed_window
                limit: 1000
                interval: '60 seconds'
            registration:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
            password_reset_request:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
            oauth_link:
                policy: fixed_window
                limit: 1000
                interval: '15 minutes'
            waitlist_join:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # High limits so the suite is never throttled; throttling itself is
        # tested by overriding the limiter service with a low-limit factory.
        rate_limiter:
            resend_verification_email:
                policy: fixed_window
                limit: 1000
                interval: '60 seconds'
            registration:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
            password_reset_request:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
            oauth_link:
                policy: fixed_window
                limit: 1000
                interval: '15 minutes'
            waitlist_join:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
