# Whether PHP should treat the request as secure. This container only ever
# listens on plain HTTP, so the answer belongs to whatever terminated TLS in
# front of it and arrives in X-Forwarded-Proto. Hardcoding "on" told PHP every
# request was HTTPS, so an instance genuinely served over plain HTTP generated
# https:// links it could not serve. A TLS-terminating proxy that sends no
# X-Forwarded-Proto is misconfigured; fix it there rather than here.
#
# This is only the fallback: once TRUSTED_PROXIES covers the proxy, Symfony
# reads X-Forwarded-Proto directly and never looks at $_SERVER['HTTPS'].
map $http_x_forwarded_proto $php_https {
    default  '';
    https    on;
}

# HSTS belongs to responses that genuinely arrived over TLS, so it keys off the
# same header. Emitted here rather than through nelmio's forced_ssl, whose
# HTTP-to-HTTPS redirect the proxy in front already performs — and which would
# also answer this container's plain-HTTP health check with a 302. nginx drops
# a header whose value is empty, so plain HTTP sends nothing.
# Apex only: includeSubDomains would strand any subdomain that is not
# HTTPS-ready, and preload is effectively permanent.
map $http_x_forwarded_proto $hsts_header {
    default  '';
    https    'max-age=31536000';
}

server {
    listen 80;

    add_header Strict-Transport-Security $hsts_header always;
    index index.php index.html;
    server_name localhost;
    # Log to the container's streams, not to files: files inside the container
    # never reach `docker logs` and grow unbounded in the writable layer.
    error_log  /dev/stderr;
    access_log /dev/stdout;
    root /var/www/html/public;

    # Compress text responses (HTML is always compressed when gzip is on).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript text/javascript
        application/xml application/rss+xml image/svg+xml
        application/ld+json application/manifest+json
        font/ttf font/otf;

    # Content-hashed AssetMapper output is immutable — cache it hard.
    # In prod the compiled file exists on disk (served static with these headers);
    # in dev it doesn't, so fall through to index.php (Symfony serves it).
    location /assets/ {
        try_files $uri /index.php?$query_string;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security $hsts_header always;
        access_log off;
    }

    # The site-review widget script: embedded on every page of every customer
    # site, so the widget boots with a fetch of this file on every page view.
    # It isn't content-hashed (a stable URL is what customers paste into their
    # site), so it can't be cached "immutable" like /assets/ — a short
    # max-age still turns most page views into a cache hit or a cheap
    # conditional-GET 304 instead of a full re-download.
    #
    # This is an exact match on the single static file, not a prefix, because
    # /site-review/ is also the prefix for dynamic Symfony routes (comment
    # resolve/reopen) that must keep falling through to index.php.
    location = /site-review/widget.js {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        add_header Strict-Transport-Security $hsts_header always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $php_https if_not_empty;
    }
}
