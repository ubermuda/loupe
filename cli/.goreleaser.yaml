version: 2

project_name: loupe

builds:
  - id: loupe
    main: .
    binary: loupe
    # Static binaries: the keychain backends this CLI uses are pure Go, so
    # nothing here needs libc.
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # goreleaser reads git itself, so `loupe version` needs no shell here.
    ldflags:
      - -s -w
      - "-X github.com/ubermuda/loupe/cli/cmd.commit={{ .FullCommit }}"
      - "-X github.com/ubermuda/loupe/cli/cmd.dirty={{ .IsGitDirty }}"
      - "-X github.com/ubermuda/loupe/cli/cmd.version={{ .Version }}"

archives:
  - id: loupe
    formats: [tar.gz]
    name_template: "loupe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

# Published at once: the cli-release workflow runs this on a `v*` tag push.
release:
  draft: false
