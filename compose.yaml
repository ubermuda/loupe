name: ${COMPOSE_PROJECT_NAME:-symfony-skeleton}

services:
  nginx:
    image: nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/common/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.dev.localhost`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=stepca
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80

  php-fpm:
    build:
      dockerfile: ./docker/dev/php-fpm/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      XDEBUG_MODE: "develop,coverage"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      - database

###> symfony/mailer ###
  # mailpit is reached via traefik at mailpit.${COMPOSE_PROJECT_NAME}.dev.localhost
  # (the e2e suite uses that URL); no host port is published.
  mailer:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit-${COMPOSE_PROJECT_NAME}.rule=Host(`mailpit.${COMPOSE_PROJECT_NAME}.dev.localhost`)
      - traefik.http.routers.mailpit-${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.mailpit-${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.mailpit-${COMPOSE_PROJECT_NAME}.tls.certresolver=stepca
      - traefik.http.services.mailpit-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8025
###< symfony/mailer ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - traefik
      - default
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.pg-${COMPOSE_PROJECT_NAME}.rule=HostSNI(`db.${COMPOSE_PROJECT_NAME}.dev.localhost`)
      - traefik.tcp.routers.pg-${COMPOSE_PROJECT_NAME}.entrypoints=postgres
      - traefik.tcp.routers.pg-${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.tcp.routers.pg-${COMPOSE_PROJECT_NAME}.tls.certresolver=stepca
      - traefik.tcp.services.pg-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=5432
###< doctrine/doctrine-bundle ###

networks:
  traefik:
    external: true

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
