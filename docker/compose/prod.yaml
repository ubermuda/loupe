# Reference production topology: a single-host Docker Compose deployment of
# Loupe. It is a complete, runnable stack — web, messenger worker and Postgres,
# plus two opt-in services behind profiles: a Mercure hub (`--profile mercure`)
# and a database backup job (`--profile backup`) — not an illustration.
# `compose.yaml` next to it is the development stack and shares nothing with this
# file: it bind-mounts the source tree, builds a development PHP image and
# expects an external Traefik network.
#
# What this file deliberately does NOT include:
#
#   * TLS. Every published port binds to loopback by default and expects a
#     reverse proxy (Caddy, nginx, Traefik) in front, terminating TLS and
#     forwarding X-Forwarded-Proto and X-Forwarded-For. Set TRUSTED_PROXIES to
#     that proxy's address or Symfony ignores those headers: generated URLs get
#     the wrong scheme and every visitor is rate-limited as one IP.
#   * Migrations. They are a one-shot release step, never a container start-up
#     step — concurrent replicas would race each other against one database.
#     Run, once per deploy:
#
#         docker compose -f docker/compose/prod.yaml --env-file docker/compose/prod.env \
#             run --rm web docker/prod/release.sh
#
#   * An SMTP server. MAILER_DSN must point at one you operate or pay for.
#     Email verification is mandatory, so nobody can register without it.
#
# Bring the stack up with:  @comment-budget-ignore
#
#     docker compose -f docker/compose/prod.yaml --env-file docker/compose/prod.env up -d
#
# `--env-file` is NOT optional. Without it Docker Compose falls back to the
# repository's `.env`, which is the *development* configuration — it would
# supply http://localhost as DEFAULT_URI and null://null as MAILER_DSN to
# production containers. Copy `docker/compose/prod.env.example` to `docker/compose/prod.env`
# and fill it in; the required-variable guards below abort the run if you
# forget, rather than silently starting a misconfigured instance.

name: ${COMPOSE_PROJECT_NAME:-loupe}

# Carried by both services so the stack builds from a clone with no registry
# access: GHCR package visibility is set separately from repository visibility,
# so a public repo does not imply a pullable image.
x-app-build: &app-build
  # Relative to THIS file, not to your shell — Compose resolves build paths
  # against the compose file's directory, so the repository root is `..`.
  context: ../..
  dockerfile: docker/prod/Dockerfile

# The web container and the worker container run the same image with the same
# configuration and differ only in what they execute, so their environment is
# defined once here.
x-app-environment: &app-environment
  APP_ENV: prod
  APP_SECRET: "${APP_SECRET:?set it in docker/compose/prod.env — generate with openssl rand -hex 16}"
  # Only needed once an encrypted column is in use; empty is a valid answer.
  APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:-}"

  DATABASE_URL: "postgresql://${POSTGRES_USER:-loupe}:${POSTGRES_PASSWORD:?set it in docker/compose/prod.env}@database:5432/${POSTGRES_DB:-loupe}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8"

  # The URL your users actually type. It is what the worker and CLI use to build
  # absolute links (password reset, export downloads), so a wrong value produces
  # mail nobody can act on.
  DEFAULT_URI: "${DEFAULT_URI:?set it in docker/compose/prod.env to the instance's public URL}"
  # The reverse proxy in front of this stack, as an IP or CIDR. Empty falls back
  # to the private ranges, which is correct when the proxy is a container or is
  # on the same private network, and wrong when it reaches the app from a public
  # address.
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"

  # The AGPL source offer, linked in the footer. Passed through with no fallback
  # on purpose: unset means the container never receives the key and the image's
  # committed default applies, so a fork that edits `.env` keeps its own value.
  APP_SOURCE_URL:

  MAILER_DSN: "${MAILER_DSN:?set it in docker/compose/prod.env — registration needs working mail}"
  MAILER_FROM_ADDRESS: "${MAILER_FROM_ADDRESS:?set it in docker/compose/prod.env to an address on a domain you control}"
  MAILER_FROM_NAME: "${MAILER_FROM_NAME:-Loupe}"

  # Must list the instance's real hostname or every MCP call is rejected by the
  # DNS-rebinding guard.
  MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?set it in docker/compose/prod.env to the instance's hostname}"
  # Gates the first-run install wizard, which fails closed in production: with no
  # token /install returns 404 and there is no way to create the first
  # administrator.
  INSTALL_TOKEN: "${INSTALL_TOKEN:?set it in docker/compose/prod.env — without it you cannot install}"
  # Optional: lets a post-deploy check read the running build from /healthz.
  # Empty means the endpoint never reports a version.
  HEALTH_PROBE_TOKEN: "${HEALTH_PROBE_TOKEN:-}"
  # Optional: the widget token of the project site-review comments file into.
  # Empty serves no widget; when set it is shown to administrators only.
  SITE_REVIEW_WIDGET_TOKEN: "${SITE_REVIEW_WIDGET_TOKEN:-}"
  # Empty shows the widget to administrators only. "1" offers it to every
  # visitor, whose comments an agent may then act on.
  SITE_REVIEW_WIDGET_PUBLIC: "${SITE_REVIEW_WIDGET_PUBLIC:-}"
  # Origin serving the widget, hence the instance its comments file into.
  # Empty is this one.
  SITE_REVIEW_WIDGET_BACKEND: "${SITE_REVIEW_WIDGET_BACKEND:-}"
  # Umami. All three, plus the analytics.enabled flag, before a tag is emitted.
  ANALYTICS_SCRIPT_URL: "${ANALYTICS_SCRIPT_URL:-}"
  ANALYTICS_WEBSITE_ID: "${ANALYTICS_WEBSITE_ID:-}"
  ANALYTICS_ORIGIN: "${ANALYTICS_ORIGIN:-}"
  ADMIN_EMAIL: "${ADMIN_EMAIL:-}"

  # Empty keeps push off: the feature flag keys off MERCURE_JWT_SECRET being set.
  # Fill both in and add `--profile mercure` to turn it on. The public URL is a
  # separate hostname your proxy routes to the hub — the bridge CLI subscribes
  # there directly, not through the app.
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: "${MERCURE_PUBLIC_URL:-}"
  MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:-}"

  # `local` is correct here, unlike on the App Platform deployment: web and
  # worker mount the same `exports` volume below, so the archive the worker
  # writes is the archive the web container serves. Switch to `s3` (and fill in
  # the rest) only if you would rather keep archives off the host — any
  # S3-compatible provider works.
  EXPORT_STORAGE: "${EXPORT_STORAGE:-local}"
  EXPORT_STORAGE_BUCKET: "${EXPORT_STORAGE_BUCKET:-}"
  EXPORT_STORAGE_PREFIX: "${EXPORT_STORAGE_PREFIX:-}"
  EXPORT_STORAGE_REGION: "${EXPORT_STORAGE_REGION:-}"
  EXPORT_STORAGE_ENDPOINT: "${EXPORT_STORAGE_ENDPOINT:-}"
  EXPORT_STORAGE_KEY: "${EXPORT_STORAGE_KEY:-}"
  EXPORT_STORAGE_SECRET: "${EXPORT_STORAGE_SECRET:-}"
  EXPORT_STORAGE_USE_PATH_STYLE: "${EXPORT_STORAGE_USE_PATH_STYLE:-false}"
  EXPORT_STORAGE_ACL: "${EXPORT_STORAGE_ACL:-private}"

  # Optional integrations. Each stays dark while empty rather than half-working.
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
  OAUTH_GOOGLE_ID: "${OAUTH_GOOGLE_ID:-}"
  OAUTH_GOOGLE_SECRET: "${OAUTH_GOOGLE_SECRET:-}"
  OAUTH_GITHUB_ID: "${OAUTH_GITHUB_ID:-}"
  OAUTH_GITHUB_SECRET: "${OAUTH_GITHUB_SECRET:-}"

services:
  # nginx + php-fpm under supervisord, and nothing else — the image's own
  # default command, so none is given here. Expired-export purging is not run
  # here any more: it rides the worker's schedule below.
  web:
    image: ${LOUPE_PROD_IMAGE:-ghcr.io/ubermuda/loupe:prod}
    build: *app-build
    restart: unless-stopped
    ports:
      # Loopback-only: a reverse proxy terminates TLS and forwards here. Set
      # LOUPE_HTTP_BIND to 0.0.0.0:80 only if this host is the proxy.
      - "${LOUPE_HTTP_BIND:-127.0.0.1:8080}:80"
    environment: *app-environment
    volumes:
      - exports:/var/www/html/var/exports
    depends_on:
      database:
        condition: service_healthy

  # Its own container from the same image, so worker restarts never recycle
  # php-fpm. scheduler_default before async deliberately: a deep async backlog
  # must not delay schedule ticks. su-exec drops to www-data so both processes
  # write the shared export volume as the same user — the local adapter writes
  # archives 0600, so a root-written one 404s for every download.
  worker:
    image: ${LOUPE_PROD_IMAGE:-ghcr.io/ubermuda/loupe:prod}
    build: *app-build
    restart: unless-stopped
    command:
      - su-exec
      - www-data
      - php
      - bin/console
      - messenger:consume
      - scheduler_default
      - async
      - --time-limit=3600
      - --memory-limit=128M
    environment: *app-environment
    volumes:
      - exports:/var/www/html/var/exports
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loupe}
      POSTGRES_USER: ${POSTGRES_USER:-loupe}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set it in docker/compose/prod.env}"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-loupe}", "-U", "${POSTGRES_USER:-loupe}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

  # Scheduled pg_dump to S3-compatible storage, with pruning. Opt-in, because a
  # self-hosted instance must work with no egress out of the box: without
  # `--profile backup` this container never starts and nothing about the stack
  # changes. Its settings are validated by the job itself rather than by the
  # abort-on-empty guards used above, which Compose applies to every command
  # including the ones that do not select this profile.  @comment-budget-ignore
  backup:
    profiles: ["backup"]
    build:
      context: ../backup
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-16}
    image: ${LOUPE_BACKUP_IMAGE:-loupe-backup:${POSTGRES_VERSION:-16}}
    restart: unless-stopped
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-loupe}
      PGPASSWORD: "${POSTGRES_PASSWORD:?set it in docker/compose/prod.env}"
      PGDATABASE: ${POSTGRES_DB:-loupe}

      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-}"
      BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-database-backups}"

      # rclone reads its whole configuration from these; there is no config file.
      RCLONE_CONFIG_S3_PROVIDER: "${BACKUP_S3_PROVIDER:-Other}"
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: "${BACKUP_S3_KEY:-}"
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: "${BACKUP_S3_SECRET:-}"
      RCLONE_CONFIG_S3_ENDPOINT: "${BACKUP_S3_ENDPOINT:-}"
      RCLONE_CONFIG_S3_REGION: "${BACKUP_S3_REGION:-}"
      RCLONE_CONFIG_S3_FORCE_PATH_STYLE: "${BACKUP_S3_USE_PATH_STYLE:-true}"
    volumes:
      - backup_scratch:/scratch
    depends_on:
      database:
        condition: service_healthy

  # Site-review push. The only subscriber is the Go bridge CLI, not a browser, so
  # no CORS config is needed. The hub keeps updates in memory, so a restart drops
  # undelivered ones — the outbox plus Last-Event-ID make replay authoritative.
  mercure:
    image: dunglas/mercure:v0.24
    restart: unless-stopped
    # Opt-in, so the default stack is three services. Start it with
    # `--profile mercure`, having set MERCURE_JWT_SECRET and MERCURE_PUBLIC_URL;
    # the hub refuses to boot on an empty key, which is the loud failure you
    # want if the profile is enabled without them.
    profiles: ["mercure"]
    ports:
      # Route MERCURE_PUBLIC_URL's hostname here from your reverse proxy.
      - "${LOUPE_MERCURE_BIND:-127.0.0.1:8081}:80"
    environment:
      # Plain HTTP on the compose network; the proxy in front terminates TLS.
      # Without this the hub's Caddy tries to obtain its own certificate.
      SERVER_NAME: ":80"
      # Both keys are the app's MERCURE_JWT_SECRET: it signs the publisher token
      # it sends and the subscriber tokens it mints for the bridge.
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET:-}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET:-}"

volumes:
  database_data:
  # Generated data-export archives, shared between the worker that writes and
  # purges them and the web container that serves them.
  exports:
  # Holds one dump at a time, between pg_dump writing it and the upload
  # succeeding. Size the host for a compressed copy of the database.
  backup_scratch:
