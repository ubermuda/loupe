server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # The document root is the ONLY difference between the main stack and a
    # per-worktree stack, so it is the one thing mounted separately. Both
    # compose files must mount a file here or nginx refuses to start.
    include /etc/nginx/docroot.conf;

    # Compress text responses (HTML is always compressed when gzip is on).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript text/javascript
        application/xml application/rss+xml image/svg+xml
        application/ld+json application/manifest+json
        font/ttf font/otf;

    # Content-hashed AssetMapper output is immutable — cache it hard.
    # In prod the compiled file exists on disk (served static with these headers);
    # in dev it doesn't, so fall through to index.php (Symfony serves it).
    location /assets/ {
        try_files $uri /index.php?$query_string;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Per-stack environment overrides. fastcgi_param lands in $_SERVER, and
        # Symfony's Dotenv skips any name already present there, so a value set
        # here beats .env.local without either file knowing about the other.
        # The e2e stack uses this to point one shared php-fpm at a disposable
        # database; every other stack mounts an empty file. Like docroot.conf,
        # nginx will not start unless something is mounted at this path.
        include /etc/nginx/app-env.conf;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }
}
