framework:
    rate_limiter:
        # Throttles write traffic on the site-review API so a leaked or scraped
        # widget token cannot be used to flood comments. Keyed per token AND
        # client address, so the allowance below is what one visitor gets on one
        # project rather than what a whole project gets.
        site_review_write:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Bounds the anonymous App webhook, keyed per client address, because
        # nothing identifies a sender before the signature check. GitHub sends
        # every tenant's App deliveries from one shared pool of addresses and
        # does not resend a refused one, so the limit is high.
        forge_deliveries:
            policy: 'sliding_window'
            limit: 3000
            interval: '1 minute'

        # Bounds a per-project forge hook. GitHub delivers for every tenant from
        # one shared pool of addresses, so an address key would let one tenant
        # starve the others. Keyed per hook key instead.
        forge_hook_deliveries:
            policy: 'sliding_window'
            limit: 300
            interval: '1 minute'

        # Bounds the whole MCP endpoint, not only writes: every JSON-RPC message
        # rides POST, including initialize, tools/list and ping. Keyed per token
        # alone, unlike the widget limiter above — see RateLimitMcpRequests.
        mcp_requests:
            policy: 'sliding_window'
            limit: 120
            interval: '1 minute'

        # The agent_* limiters below share one shape: 60 requests a minute per
        # token. The anchor sits on the first of them, and the others merge it.
        # Bounds the bridge's board reads, both GETs. A bridge reads the columns
        # of each mapped project once at start, and a card before each resume.
        agent_board_columns: &agent_per_token
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Bounds the bridge's rule health reports. A bridge reports at start
        # and whenever a rule changes state.
        agent_bridge_rule_reports:
            <<: *agent_per_token

        # Bounds the bridge's run reports: the finished run, each run state and
        # the run inventory. A run sends about four states, and a burst of card
        # moves sends them at once, so the limit drains a full bridge queue of 256.
        agent_worker_runs:
            <<: *agent_per_token
            limit: 240

        # Bounds the bridge's ask checks, a GET. A bridge checks once before
        # each resume, and a resume follows a finished worker.
        agent_inbox_ask_checks:
            <<: *agent_per_token

        # Bounds bridge heartbeats. Several bridges can share a token, and each
        # posts once a minute at the default interval.
        agent_bridge_heartbeats:
            <<: *agent_per_token

        # Bounds failed authentications on the token firewalls, ^/api and ^/mcp,
        # because each one writes a durable audit record. A successful bearer
        # request spends nothing. Keyed per client address alone, unlike the
        # others above: the check runs before any token is resolved, and a rejected
        # token is attacker-chosen.
        api_authentication:
            policy: 'sliding_window'
            limit: 300
            interval: '1 minute'

        # Bounds the public OAuth token endpoint: code exchanges and refreshes.
        # Keyed per client address, because the client id is caller-chosen.
        oauth_token:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Bounds Client ID Metadata Document fetches, each an outbound request
        # made inline in the authorize request. Keyed per signed-in user; a
        # cached document costs nothing.
        oauth_client_metadata_fetch:
            policy: 'sliding_window'
            limit: 20
            interval: '10 minutes'

        # Bounds the public device authorization endpoint. Each request writes a
        # device code row. Keyed per client address, like oauth_token.
        oauth_device_authorization:
            policy: 'sliding_window'
            limit: 20
            interval: '1 minute'

        # Bounds the user codes one signed-in user can try on the verification
        # page. A code is eight letters from twenty, so this keeps a guess
        # hopeless. Keyed per user, because the page requires one.
        oauth_device_verification:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'

        # Bounds Client ID Metadata Document fetches across every user. DNS has
        # no timeout in PHP, so a slow host holds a worker for the fetch's
        # duration, and open signup makes the per-user bucket cheap to widen.
        oauth_client_metadata_fetch_global:
            policy: 'sliding_window'
            limit: 120
            interval: '10 minutes'

        # Bounds subscriber-cookie renewals from open pages. A page renews once
        # before each reconnect, with backoff, so a real page stays far below
        # this. Keyed per signed-in user, because the route requires one.
        mercure_authorize:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'

# The e2e suite drives one dev instance, and PHPUnit drives one kernel, both
# from a single client address. A per-address limit therefore accumulates across
# unrelated specs. Relax it there, never in prod.
when@dev:
    framework:
        rate_limiter:
            api_authentication:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            forge_deliveries:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            forge_hook_deliveries:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            mercure_authorize:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_token:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_client_metadata_fetch:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_client_metadata_fetch_global:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_device_authorization:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_device_verification:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            forge_deliveries:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            forge_hook_deliveries:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            api_authentication:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            mercure_authorize:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_token:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_client_metadata_fetch:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_client_metadata_fetch_global:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_device_authorization:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            oauth_device_verification:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
