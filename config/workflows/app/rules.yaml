# Rules the app adds to the workflow of every project, after the rules of its template.
# A request may name a prompt, the file prompts/<name>.md, which the work request carries to the bridge.
rules:
    # The rule reads the state of the discovery run, so a failed run turns it false and the engine does not retry.
    - id: discovery
      slot: '@backlog'
      when: { card.discovery.requested: {} }
      then:
          request:
              kind: discovery
              onTimeout: expire
              prompt: discovery
              checks:
                  - The Loupe plugin skills are installed for the agent, with the loupe-discovery skill
                  - The bridge rule file maps the discovery kind, or sets appPrompts to true

# Work the app asks a bridge for outside the engine. Each entry ships a prompt.
requests:
    - id: insights.analysis
      kind: analysis
      prompt: analysis
      checks:
          - The Loupe plugin skills are installed for the agent, with the loupe-analysis skill
          - The bridge rule file maps the analysis kind, or sets appPrompts to true
