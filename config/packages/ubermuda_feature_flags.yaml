ubermuda_feature_flags:
    # Directories the "scan for undefined flags" admin page walks looking for
    # flag names referenced in code but not defined in the database.
    scan:
        paths:
            - '%kernel.project_dir%/templates'
            - '%kernel.project_dir%/src'

    # Environment a feature needs before it can work at all. While any of these
    # is unset or blank the flag reads as off whatever is stored, and the admin
    # shows it as unavailable instead of a switch that cannot work.
    prerequisites:
        # No hub means nothing to publish to and no subscriber token to sign.
        # MERCURE_JWT_SECRET ships with no default on purpose, so an instance
        # that never configured Mercure has site-review push off by default
        # rather than failing at the moment someone submits a review.
        # MERCURE_PUBLIC_URL belongs here too: the gated feature includes
        # issuing subscriber credentials, and with it blank the endpoint hands
        # back an empty hubUrl that no bridge client can subscribe to.
        site_review.push.enabled: ['MERCURE_URL', 'MERCURE_PUBLIC_URL', 'MERCURE_JWT_SECRET']
