# Registered in every environment, but only prod configures a header. Dev and
# test enable the `csp` node alone, because that is what registers the
# `csp_nonce()` Twig function base.html.twig calls on every page; with no
# directives there is still no policy to send.
when@dev: &nonce_only
    nelmio_security:
        csp:
            enabled: true

when@test: *nonce_only

when@prod:
    nelmio_security:
        # X-Frame-Options: SAMEORIGIN — allow framing only by our own origin.
        clickjacking:
            paths:
                '^/.*': SAMEORIGIN

        # X-Content-Type-Options: nosniff
        content_type:
            nosniff: true

        # Referrer-Policy: strict-origin-when-cross-origin
        referrer_policy:
            enabled: true
            policies:
                - 'strict-origin-when-cross-origin'

        # REPORT-ONLY (the `report` key, not `enforce`), so it blocks nothing. No
        # report-uri is set and the bundle ships no route for its reporting
        # controller, so nothing collects violations either — this allow-list has
        # never been checked against real traffic. Collecting them needs a public
        # unauthenticated endpoint, which is a decision rather than a config line.
        csp:
            # CSP only makes sense on HTML documents; skip assets, JSON, downloads.
            content_types: ['text/html']
            # Standard header only — skip the legacy X-Content-Security-Policy /
            # X-WebKit-CSP variants (and the per-request User-Agent parsing they need).
            compat_headers: false
            report:
                default-src: ["'self'"]
                base-uri: ["'self'"]
                object-src: ["'none'"]
                frame-ancestors: ["'self'"]
                script-src: ["'self'", "'unsafe-inline'"]
                # Fonts are self-hosted (assets/fonts, SIL OFL) — no external
                # font or stylesheet origins are needed.
                style-src: ["'self'", "'unsafe-inline'"]
                font-src: ["'self'"]
                img-src: ["'self'", 'data:', 'https:']
                connect-src: ["'self'"]
