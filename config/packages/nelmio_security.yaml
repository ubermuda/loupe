# Registered in every environment, but only prod configures a header. Dev and
# test enable the `csp` node alone, because that is what registers the
# `csp_nonce()` Twig function base.html.twig calls on every page; with no
# directives there is still no policy to send.
when@dev: &nonce_only
    nelmio_security:
        csp:
            enabled: true

when@test: *nonce_only

when@prod:
    nelmio_security:
        # X-Frame-Options: SAMEORIGIN — allow framing only by our own origin.
        clickjacking:
            paths:
                '^/.*': SAMEORIGIN

        # X-Content-Type-Options: nosniff
        content_type:
            nosniff: true

        # Referrer-Policy: strict-origin-when-cross-origin
        referrer_policy:
            enabled: true
            policies:
                - 'strict-origin-when-cross-origin'

        # ENFORCING. The one violation report-only surfaced on the live site was
        # a `data:application/javascript,` script, which AssetMapper emitted for
        # the CSS entry in the import map; the stylesheet is a plain <link> now,
        # so nothing needs `data:` in script-src.
        csp:
            # CSP only makes sense on HTML documents; skip assets, JSON, downloads.
            content_types: ['text/html']
            # Standard header only — skip the legacy X-Content-Security-Policy /
            # X-WebKit-CSP variants (and the per-request User-Agent parsing they need).
            compat_headers: false
            enforce:
                default-src: ["'self'"]
                base-uri: ["'self'"]
                object-src: ["'none'"]
                frame-ancestors: ["'self'"]
                # The bundle appends 'unsafe-inline' next to the nonce as its
                # CSP Level 1 fallback; a nonce-aware browser discards it. Not
                # listed here so the fallback is the only thing adding it.
                # Unset, an external origin falls back to 'self' — a no-op
                # rather than an empty token.
                script-src: ["'self'", "%env(default:app.csp_origin_fallback:ANALYTICS_ORIGIN)%", "%env(default:app.csp_origin_fallback:SITE_REVIEW_WIDGET_BACKEND)%"]
                # Fonts are self-hosted (assets/fonts, SIL OFL) — no external
                # font or stylesheet origins are needed.
                style-src: ["'self'", "'unsafe-inline'"]
                font-src: ["'self'"]
                # No wholesale 'https:': a rendered document's remote <img>
                # would otherwise turn the reviewer's browser into an egress channel.
                img-src: ["'self'", 'data:']
                # Umami Cloud loads its script from one origin and posts events to
                # another, so the collect origin is listed separately.
                connect-src: ["'self'", "%env(default:app.csp_origin_fallback:ANALYTICS_ORIGIN)%", "%env(default:app.csp_origin_fallback:ANALYTICS_COLLECT_ORIGIN)%", "%env(default:app.csp_origin_fallback:SITE_REVIEW_WIDGET_BACKEND)%"]
