; Console commands in dev need more than PHP's 128M default: warming a cold
; cache compiles every Twig template at once, and Symfony's dev-mode container
; is large. Exhaustion there surfaces as a DebugClassLoader trace that reads
; like a real error, so the ceiling is worth having rather than diagnosing.
;
; conf.d is shared by both SAPIs, so this reaches FPM too — zz-pm.conf pins the
; pool back to 128M, which is what production runs. Dev should not be the more
; forgiving of the two, or a memory regression passes here and fails there.
memory_limit = 512M
