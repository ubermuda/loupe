monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - app_security # Access denials and authentication failures, handled outside the prod buffer

when@dev:
    monolog:
        handlers:
            # Buffered, like test and prod: a plain debug stream here wrote
            # every doctrine query unconditionally, and the messenger worker
            # polls once a second — which grew dev.log past 600 MB and buried
            # the exceptions it was meant to surface. Errors now flush the
            # buffer with their full debug context; quiet runs write nothing.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                # The MCP endpoint answers GET with 405 by design, so without
                # this every agent handshake would flush the buffer.
                excluded_http_codes: [404, 405]
                # 'deprecation' has its own always-on handler below, so it stays
                # visible without needing an error to flush it.
                channels: ["!event", "!deprecation", "!app", "!app_security"]
                buffer_size: 100 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                # Render full stack traces for Throwables passed under the
                # native 'exception' context key.
                include_stacktraces: true
            # Always-on, matching prod: neither trail may depend on a request
            # also failing. include_stacktraces because these streams now handle
            # app-channel errors too, which `nested` no longer sees.
            domain_events:
                type: stream
                channels: [app]
                level: info
                include_stacktraces: true
                path: "%kernel.logs_dir%/%kernel.environment%.log"
            security_events:
                type: stream
                channels: [app_security]
                level: info
                include_stacktraces: true
                path: "%kernel.logs_dir%/%kernel.environment%.log"
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.log"
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # Each of these has an always-on handler below. Buffered, their
                # records only survive a request that also errors — losing a cache
                # write failure, a denial ending in a clean 401, or the entire
                # domain event trail on every successful write.
                channels: ["!deprecation", "!cache", "!app_security", "!app"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
                # Stack traces for Throwables under the native 'exception' key.
                # The bundle mutates a shared formatter to do it, so deprecation
                # entries carry traces too — which is wanted: a deprecation
                # without its call site is not actionable.
                include_stacktraces: true
            # Both trails have their own stderr stream above, and console output
            # lands on the same stderr in production — so without these
            # exclusions a worker or cron record is emitted twice, once
            # console-formatted and once as JSON.
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!app", "!app_security"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Always-on, NOT behind fingers_crossed: cache adapters log write
            # failures at WARNING, which the main handler buffers and flushes only
            # on an error — so a lone cache-pool failure, silently disabling
            # anything using the pool, would never reach stderr.
            cache_warnings:
                type: stream
                channels: [cache]
                level: warning
                path: php://stderr
                formatter: monolog.formatter.json
            # Always-on for the same reason: denials and failed authentications are
            # logged at info, and a request that ends in a clean 401 or 403 never
            # raises the main buffer to error — so the entire security trail was
            # written and then discarded. 'info' is the floor, not a preference.
            security_events:
                type: stream
                channels: [app_security]
                level: info
                path: php://stderr
                formatter: monolog.formatter.json
            # The domain event trail; info is the floor, not a preference.
            # include_stacktraces because this is now the only handler for
            # app-channel errors — `nested` no longer receives them.
            domain_events:
                type: stream
                channels: [app]
                level: info
                path: php://stderr
                formatter: monolog.formatter.json
                include_stacktraces: true
