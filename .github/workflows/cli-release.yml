name: CLI release

# The CLI has its own version track, with tags such as `cli/v1.0.0`. GoReleaser
# OSS reads no tag prefix, so it only builds, and `gh` publishes the release.
on:
  push:
    tags: ['cli/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Read the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#cli/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a cli/vX.Y.Z tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Vet and test
        working-directory: cli
        run: go vet ./... && go test ./...
      # validate refuses a GORELEASER_CURRENT_TAG that git does not hold.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish,validate
          workdir: cli
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes start at the next lower CLI tag, never at a server tag.
          previous=$(git tag --list 'cli/v*' --sort=-v:refname \
            | awk -v cur="$GITHUB_REF_NAME" 'found { print; exit } $0 == cur { found = 1 }')
          start=()
          if [ -n "$previous" ]; then start=(--notes-start-tag "$previous"); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "loupe CLI ${GITHUB_REF_NAME#cli/}" --generate-notes "${start[@]}" \
            cli/dist/*.tar.gz cli/dist/checksums.txt
