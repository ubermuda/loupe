doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Per-worktree database isolation: empty in the main checkout, set to
        # _wt_<slug> by a worktree's .env.local. A worktree is served through its
        # own public/index.php, so browser and CLI load that worktree's .env chain
        # alike. when@test below overrides it, so tests never touch the dev DB.
        dbname_suffix: '%env(default::WORKTREE_DB_SUFFIX)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        types:
            tsvector: MartinGeorgiev\Doctrine\DBAL\Types\Tsvector

        # Required, not redundant: BaseType::getSQLDeclaration() calls
        # getDoctrineTypeMapping('tsvector'), which throws without an entry here.
        # It also claims the introspected type, so migrate-diff stops proposing an
        # ALTER already applied. Removing this looks like tidying, and breaks both.
        mapping_types:
            tsvector: tsvector
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        dql:
            numeric_functions:
                # Postgres full-text search has no DQL equivalent. TSMATCH is the
                # @@ operator and yields a boolean, so DQL has to compare it:
                # "TSMATCH(...) = true" — the idiom the library's own docblock
                # prescribes, not a workaround.
                TSMATCH: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\Tsmatch
                TS_RANK: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\TsRank
            string_functions:
                # A string function because TSMATCH and TS_RANK parse their
                # arguments with StringPrimary(), which only accepts a nested
                # function if it is registered as one returning a string.
                WEBSEARCH_TO_TSQUERY: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\WebsearchToTsquery
                # Casts the per-row search_language column to regconfig, which is
                # the only type websearch_to_tsquery/2 accepts. A string function
                # for the same reason as the line above: it nests inside one.
                CAST: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\Cast
        # The audit package holds an actor and a credential as interfaces so it
        # never learns what this application calls a user. Doctrine cannot load
        # metadata for an unresolved interface, so an audit_log association only
        # maps once these are declared.
        resolve_target_entities:
            Ubermuda\AuditBundle\AuditActorInterface: App\Module\Account\Entity\User
            Ubermuda\AuditBundle\AuditCredentialInterface: App\Module\Account\Entity\ApiToken
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
