key: lifecycle
version: 1
slots:
    - { key: next, label: workflow.slot.next }
    - { key: product-design, label: workflow.slot.product_design }
    - { key: tech-design, label: workflow.slot.tech_design }
    - { key: implementation, label: workflow.slot.implementation }
    - { key: in-review, label: workflow.slot.in_review }
manualMoves:
    - { from: '@backlog', to: next }
    - { from: next, to: '@backlog' }
    - { from: '@backlog', to: product-design }
    - { from: '@backlog', to: tech-design }
    - { from: next, to: product-design }
    - { from: next, to: tech-design }
    - { from: implementation, to: tech-design }
    - { from: '@backlog', to: implementation, by: parent-run }
backoffMinutes: [10, 60, 360]
workTimeoutMinutes: 120
rules:
    - id: product-design-session
      slot: product-design
      when: { not: { card.document: { tag: product-design } } }
      then:
          request:
              kind: product-design
              capability: interactive
              checks:
                  - An interactive session that the owner can join
                  - The Loupe plugin skills are installed for the agent

    - id: product-design-revise
      slot: product-design
      when: { card.document_changes_requested: { tag: product-design } }
      then:
          request:
              kind: product-design-revise
              document: { tag: product-design, status: changes-requested }
              checks:
                  - The Loupe plugin skills are installed for the agent

    - id: product-design-approved
      slot: product-design
      when:
          all:
              - card.document_approved: { tag: product-design }
              - not: { card.document_changes_requested: { tag: product-design } }
      then: { move: { to: tech-design } }

    - id: tech-design-write
      slot: tech-design
      when: { not: { card.document: { tag: tech-design } } }
      then:
          request:
              kind: tech-design
              checks:
                  - The agent can read the whole repository
                  - Agent instructions such as AGENTS.md or CLAUDE.md describe the architecture
                  - The Loupe plugin skills are installed for the agent

    - id: tech-design-revise
      slot: tech-design
      when: { card.document_changes_requested: { tag: tech-design } }
      then:
          request:
              kind: tech-design-revise
              document: { tag: tech-design, status: changes-requested }
              checks:
                  - The agent can read the whole repository
                  - Agent instructions such as AGENTS.md or CLAUDE.md describe the architecture
                  - The Loupe plugin skills are installed for the agent

    - id: tech-design-approved
      slot: tech-design
      when:
          all:
              - card.document_approved: { tag: tech-design }
              - not: { card.document_changes_requested: { tag: tech-design } }
              - not: { card.has_open_blocker: {} }
      then: { move: { to: implementation } }

    - id: implement
      slot: implementation
      when:
          all:
              - not: { card.type: { type: epic } }
              - not: { pr.linked: {} }
      then:
          request:
              kind: implement
              checks:
                  - A worktree per card, so two cards never share one checkout
                  - A preview URL per branch, with the review widget on it
                  - The .loupe/lifecycle.md sections that the stage skills read
                  - A build command and a test command that an agent can run
                  - A review step before a push
                  - The agent pushes as its own GitHub account

    - id: breakdown
      slot: implementation
      when: { card.type: { type: epic } }
      then:
          request:
              kind: breakdown
              checks:
                  - The Epics section of .loupe/lifecycle.md, when the project uses epic branches
                  - Permission to push an epic branch

    - id: reviewable
      slot: implementation
      when:
          all:
              - not: { card.type: { type: epic } }
              - pr.open: {}
              - not: { pr.draft: {} }
              - pr.checks_passed: {}
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
      then: { move: { to: in-review } }

    - id: fix-in-implementation
      slot: implementation
      when:
          all:
              - pr.open: {}
              - any:
                    - pr.checks_failed: {}
                    - pr.conflicting: {}
                    - pr.changes_requested: {}
      then:
          request:
              kind: fix
              limit: 3
              checks:
                  - The worktree of the card is still available, or the agent can make it again
                  - The gate commands of .loupe/lifecycle.md
                  - Read access to the CI check logs

    - id: fix-in-review
      slot: in-review
      when:
          all:
              - pr.open: {}
              - any:
                    - pr.checks_failed: {}
                    - pr.conflicting: {}
                    - pr.changes_requested: {}
      then:
          request:
              kind: fix
              limit: 3
              checks:
                  - The worktree of the card is still available, or the agent can make it again
                  - The gate commands of .loupe/lifecycle.md
                  - Read access to the CI check logs

    - id: back-to-draft
      slot: in-review
      when:
          all:
              - not: { card.type: { type: epic } }
              - pr.draft: {}
      then: { move: { to: implementation } }

    - id: rebase-stacked
      slot: in-review
      when:
          all:
              - pr.open: {}
              - pr.stacked: {}
              - pr.parent_merged: {}
      then: { forge-write: { write: change-base, fallback: rebase-stacked } }

    - id: update-behind
      slot: in-review
      when:
          all:
              - pr.open: {}
              - pr.behind: {}
              - any:
                    - pr.approval_covers_head: { min: 1 }
                    - pr.base_is_epic_branch: {}
      then: { forge-write: { write: update-branch, fallback: sync } }

    - id: merge-ready
      slot: in-review
      when:
          all:
              - card.children_finished: {}
              - pr.open: {}
              - not: { pr.draft: {} }
              - pr.checks_passed: {}
              - pr.approval_covers_head: { min: 1 }
              - pr.base_is_merge_target: {}
              - not: { pr.base_is_epic_branch: {} }
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
              - not: { pr.behind: {} }
      then: { forge-write: { write: merge, fallback: merge } }

    - id: merge-ready-epic-child
      slot: in-review
      when:
          all:
              - card.children_finished: {}
              - pr.open: {}
              - not: { pr.draft: {} }
              - pr.checks_passed: {}
              - pr.base_is_epic_branch: {}
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
              - not: { pr.behind: {} }
      then: { forge-write: { write: merge, fallback: merge } }

    - id: epic-to-review
      slot: implementation
      when:
          all:
              - card.type: { type: epic }
              - card.has_children: {}
              - card.children_finished: {}
              - pr.open: {}
              - not: { run.work_active: { kind: breakdown } }
      then: { move: { to: in-review } }

    - id: epic-to-done
      slot: implementation
      when:
          all:
              - card.type: { type: epic }
              - card.has_children: {}
              - card.children_finished: {}
              - not: { pr.linked: {} }
              - not: { card.child_merged_into_epic_branch: {} }
              - not: { run.work_active: { kind: breakdown } }
      then: { move: { to: '@terminal' } }

    - id: breakdown-ended
      when:
          all:
              - card.type: { type: epic }
              - not: { run.worker_active: {} }
      then: { evaluate: { cards: children } }

    - id: epic-reopened-from-review
      slot: in-review
      when:
          all:
              - card.type: { type: epic }
              - not: { card.children_finished: {} }
      then: { move: { to: implementation } }

    - id: epic-reopened-from-done
      slot: '@terminal'
      when:
          all:
              - card.type: { type: epic }
              - not: { card.children_finished: {} }
      then: { move: { to: implementation } }

    - id: epic-open-pull-request
      slot: implementation
      when:
          all:
              - card.type: { type: epic }
              - card.child_merged_into_epic_branch: {}
              - not: { pr.open: {} }
      then: { forge-write: { write: open-epic } }

    - id: epic-draft
      slot: implementation
      when: { card.type: { type: epic } }
      then: { forge-write: { write: draft } }

    - id: epic-ready
      slot: in-review
      when: { card.type: { type: epic } }
      then: { forge-write: { write: ready } }

    - id: epic-close
      slot: '@backlog'
      when: { card.type: { type: epic } }
      then: { forge-write: { write: close } }

    - id: teardown
      slot: '@terminal'
      when: { all: [] }
      then:
          request:
              kind: teardown
              onTimeout: expire
              checks:
                  - A command that removes the worktree and the preview of a finished card

    - id: epic-preview
      slot: '@terminal'
      when:
          all:
              - card.is_child: {}
              - pr.base_is_epic_branch: {}
              - pr.all_finished_one_merged: {}
      then:
          request:
              kind: epic-preview
              onTimeout: expire
              checks:
                  - A preview URL per epic branch

    - id: child-unblocked
      slot: '@backlog'
      when:
          all:
              - card.is_child: {}
              - not: { card.has_open_blocker: {} }
              - not: { pr.linked: {} }
              - not: { parent.work_active: {} }
      then: { move: { to: implementation } }

    # No slot, so its truth outlives a move: a person who moves a card with an open pull request to the Backlog makes no edge.
    - id: pull-request-reopened
      when:
          all:
              - not: { card.type: { type: epic } }
              - pr.open: {}
      then: { move: { to: implementation, from: '@backlog' } }

    - id: merged
      when:
          all:
              - not: { card.in_slot: { slot: '@terminal' } }
              - pr.all_finished_one_merged: {}
              - card.children_finished: {}
              - any: [{ not: { card.type: { type: epic } } }, { not: { run.worker_active: {} } }]
      then: { move: { to: '@terminal' } }
