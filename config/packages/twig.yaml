twig:
    file_name_pattern: '*.twig'
    globals:
        site_review_widget_token: '%env(SITE_REVIEW_WIDGET_TOKEN)%'
        site_review_widget_backend: '%env(SITE_REVIEW_WIDGET_BACKEND)%'
        site_review_widget_public: '%env(bool:SITE_REVIEW_WIDGET_PUBLIC)%'
        app_source_url: '%app.source_url%'
        app_docs_url: '%app.docs_url%'
    paths:
        '%kernel.project_dir%/templates/Audit': 'Audit'
        '%kernel.project_dir%/templates/Module/Analytics': 'Analytics'
        '%kernel.project_dir%/templates/Module/Account': 'Account'
        '%kernel.project_dir%/templates/Module/Admin': 'Admin'
        '%kernel.project_dir%/templates/Module/Billing': 'Billing'
        '%kernel.project_dir%/templates/Module/Diagnostics': 'Diagnostics'
        '%kernel.project_dir%/templates/Module/Landing': 'Landing'
        '%kernel.project_dir%/templates/Module/Legal': 'Legal'
        '%kernel.project_dir%/templates/Module/Project': 'Project'
        '%kernel.project_dir%/templates/Module/Review': 'Review'
        '%kernel.project_dir%/templates/Module/SiteReview': 'SiteReview'
        '%kernel.project_dir%/var/tailwind': 'tailwind'
        '%kernel.project_dir%/assets/styles': 'EmailStyles'

when@test:
    twig:
        strict_variables: true
        paths:
            # Backs AdminUserPanelFixture. A fixture template must not sit under
            # templates/Module/, which is production markup.
            '%kernel.project_dir%/tests/Support/templates': 'TestFixtures'
