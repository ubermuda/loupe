version: 2

project_name: loupe

builds:
  - id: loupe
    main: .
    binary: loupe
    # Static binaries: the keychain backends this CLI uses are pure Go, so
    # nothing here needs libc.
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # goreleaser reads git itself, so `loupe version` needs no shell here.
    ldflags:
      - -s -w
      - "-X github.com/ubermuda/loupe/cli/cmd.commit={{ .FullCommit }}"
      - "-X github.com/ubermuda/loupe/cli/cmd.dirty={{ .IsGitDirty }}"
      - "-X github.com/ubermuda/loupe/cli/cmd.version={{ .Version }}"

archives:
  - id: loupe
    formats: [tar.gz]
    name_template: "loupe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# A cli/vX.Y.Z tag is no semver, so a snapshot must not read .Version.
snapshot:
  version_template: "0.0.0-snapshot-{{ .ShortCommit }}"

# The cli-release workflow publishes with `gh`, which writes the notes.
changelog:
  disable: true
