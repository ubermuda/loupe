security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Module\Account\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        mcp:
            pattern: ^/mcp
            stateless: true
            custom_authenticators:
                - App\Module\Account\Security\ApiTokenAuthenticator
        api:
            pattern: ^/api
            stateless: true
            custom_authenticators:
                - App\Module\Account\Security\ApiTokenAuthenticator
            access_denied_handler: App\Module\Account\Security\ApiAccessDeniedHandler
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                default_target_path: app_home
                enable_csrf: true
            login_throttling:
                max_attempts: 5
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
            remember_me:
                secret: '%env(APP_SECRET)%'
                lifetime: 2592000
                path: /
                always_remember_me: false

    access_control:
        - { path: ^/api/site-review, roles: ROLE_API_SITE_REVIEW }
        - { path: ^/mcp,             roles: ROLE_API_MCP }
        # The /dev/* controllers are #[When('dev')] only, so this path 404s in
        # prod and this rule is inert there. It exists so the e2e seeding endpoint
        # is reachable unauthenticated in the dev environment.
        - { path: ^/dev/register-and-verify$, roles: PUBLIC_ACCESS }
        - { path: ^/dev/site-review-harness$, roles: PUBLIC_ACCESS }
        - { path: ^/login,           roles: PUBLIC_ACCESS }
        - { path: ^/register,        roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/,                roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
