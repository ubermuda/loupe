# Overrides that make the dev stack usable on a CI runner, where there is no
# traefik and no step-ca. Ports are published straight to the runner instead,
# so the app answers on http://localhost — which is what DEFAULT_URI in .env
# already says, so no URL rewriting is needed anywhere.
#
#   docker compose -f compose.yaml -f docker/compose/ci.yaml up -d ...
#
# The traefik labels on the services stay in place and are simply inert without
# traefik running; the network they attach to is created empty by the workflow.
services:
  nginx:
    ports:
      - '80:80'

  mailer:
    ports:
      - '8025:8025'

  php-fpm:
    environment:
      # The dev stack collects coverage on every request. Nothing reads it in a
      # normal CI run, and it roughly doubles the PHPUnit leg on a small runner.
      # The weekly coverage workflow sets XDEBUG_MODE=coverage to turn it back on.
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
