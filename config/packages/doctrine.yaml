doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Per-worktree database isolation. Empty in the main checkout; a
        # worktree's .env.local sets it to _wt_<slug> (written by
        # worktree-bootstrap.sh), which is enough for BOTH the browser and the
        # CLI: a worktree is served through its own public/index.php, so
        # Symfony boots with the worktree as its project directory and loads
        # that worktree's .env chain either way.
        #
        # when@test below overrides this with its own scalar value, so the test
        # environment keeps using app_test_<token> and never the dev database.
        dbname_suffix: '%env(default::WORKTREE_DB_SUFFIX)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        types:
            tsvector: MartinGeorgiev\Doctrine\DBAL\Types\Tsvector

        # Required, not redundant. The package's BaseType::getSQLDeclaration()
        # builds the column definition by calling
        # $platform->getDoctrineTypeMapping('tsvector'), which throws without an
        # entry here. It also claims the introspected type, so migrate-diff stops
        # proposing an ALTER that has already been applied. Removing this looks
        # like tidying a duplicate registration and breaks both.
        mapping_types:
            tsvector: tsvector
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        dql:
            numeric_functions:
                # Postgres full-text search has no DQL equivalent. TSMATCH is the
                # @@ operator and yields a boolean, so DQL has to compare it:
                # "TSMATCH(...) = true" — the idiom the library's own docblock
                # prescribes, not a workaround.
                TSMATCH: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\Tsmatch
                TS_RANK: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\TsRank
            string_functions:
                # A string function because TSMATCH and TS_RANK parse their
                # arguments with StringPrimary(), which only accepts a nested
                # function if it is registered as one returning a string.
                WEBSEARCH_TO_TSQUERY: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\WebsearchToTsquery
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
