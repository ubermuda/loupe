# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            - resend-verification
            - accept-terms
            - revoke-api-token
            - submit-review
            - comment-action
            - mint-project-widget-token
            - mint-project-mcp-token
            - regenerate-project-mcp-token
            - regenerate-project-widget-token
            - toggle-project-widget-forwarding
            - site-review-comment-action
            - billing-checkout
            - billing-portal
            - wizard-skip
            - wizard-mint-mcp
            - wizard-mint-widget
            - wizard-finish
            - request-data-export
            - request-account-deletion
            - confirm-account-deletion
            - admin-waitlist-invite
