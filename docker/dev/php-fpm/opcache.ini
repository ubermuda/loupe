; Dev opcache sizing. The base image defaults (128MB, 10k files) saturate when
; the main checkout plus several worktrees (~18k PHP files each) share this
; php-fpm: memory fills at ~6.5k cached scripts, hit rate drops below 50%, and
; every request recompiles from source — slow enough to blow Playwright
; timeouts on worktree e2e runs. Memory is the binding constraint; raising
; only the file cap changes nothing.
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531
opcache.validate_timestamps=1
