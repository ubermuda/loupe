[supervisord]
nodaemon=true                ; keep Supervisor in foreground (PID 1)
loglevel=info
logfile_maxbytes=0             ; disable rotation

[program:php-fpm]
command          = /usr/local/sbin/php-fpm --nodaemonize
autorestart      = true
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0      ; ← disable rotation
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0      ; ← avoid stale settings
stderr_logfile_backups  = 0

[program:nginx]
command          = /usr/sbin/nginx -g 'daemon off; error_log /dev/stderr info;'
autorestart      = true
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0

; The messenger worker is intentionally NOT a program here. In prod it runs as
; its own container from this same image — the deploy config overrides the
; command with:
;   php bin/console messenger:consume scheduler_default async --time-limit=3600 --memory-limit=128M
; (scheduler_default listed first deliberately — a deep async backlog must not
; delay schedule ticks). Keeping it out of this supervisord means worker
; restarts and scaling never recycle php-fpm/nginx.

[program:export-purge]
; No cron daemon in this image — a supervised sleep loop is the backstop for
; the messenger worker's opportunistic purge (see GenerateDataExportHandler,
; consumed in the separate worker container), so an
; expired export's archive is still deleted even on an installation quiet
; enough that no later export ever completes to trigger it.
;
; Running this in the web container only reaches the archives the worker wrote
; because both address the same export storage (EXPORT_STORAGE) rather than a
; local directory. On a split web/worker deployment that leaves EXPORT_STORAGE
; at `local`, this loop deletes rows whose archives it cannot see — but so does
; every other part of the export feature, which is why that combination is not
; a supported production configuration (see .env and DEPLOY.md).
command          = bash -c 'while true; do php /var/www/html/bin/console app:purge-expired-exports; sleep 3600; done'
user             = www-data
autorestart      = true
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0
