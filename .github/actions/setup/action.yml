name: Set up the project
description: PHP, just, and the project's dependencies — plus Node and the Docker stack for the legs that need them.

inputs:
  node:
    description: Install Node and the npm dependencies.
    default: 'false'
  docker:
    description: Bring up the php-fpm and database containers and build the stylesheet.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: ctype, iconv, intl, pdo_pgsql, zip, bcmath, xsl
        coverage: none

    - uses: ./.github/actions/setup-just

    - uses: actions/cache@v6
      with:
        path: vendor
        key: vendor-${{ hashFiles('composer.lock') }}

    # On a workstation composer runs in the container, because the host is a Mac
    # with a different PHP. Here the runner is pinned to the same 8.5 and the same
    # extension set, and the container bind-mounts this checkout, so one install
    # on the host serves every leg — including the ones that need no container
    # at all. twig.yaml registers var/tailwind as a template path, and the
    # post-install cache:clear refuses to run without it.
    - name: Install PHP dependencies
      shell: bash
      run: |
        mkdir -p var/tailwind
        composer install --no-interaction --no-progress

    - if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          e2e/package-lock.json

    - if: inputs.node == 'true'
      shell: bash
      run: |
        npm ci
        npm ci --prefix e2e

    # The publish job in ci.yml pushes the image under a hash of the Dockerfile and
    # the files it copies, and the ISO week, so the mutable base image refreshes weekly. A hit skips buildx and the build. Any failure is a miss
    # and falls back to the build below.
    - if: inputs.docker == 'true'
      id: prebuilt
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: |
        tag=$(docker compose config --images php-fpm | grep -E -- '-php-fpm$')
        test "$(printf '%s\n' "$tag" | grep -c .)" = 1
        hash=$( { date -u +%G-%V; cat docker/dev/php-fpm/Dockerfile docker/dev/php-fpm/*.conf docker/dev/php-fpm/*.ini; } | sha256sum | cut -c1-16)
        repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
        image="ghcr.io/$repo/php-fpm:$hash"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        if echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 \
          && docker pull "$image" >/dev/null 2>&1 && docker tag "$image" "$tag"; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "Pulled $image"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "No pre-built image $image, building"
        fi

    # A Docker Hub pull first asks auth.docker.io for a token, and that request
    # can time out on a runner. BuildKit and the compose images come from
    # mirror.gcr.io instead. The second buildx step is the Docker Hub fallback.
    - if: inputs.docker == 'true' && steps.prebuilt.outputs.hit != 'true'
      id: buildx-mirror
      continue-on-error: true
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - if: inputs.docker == 'true' && steps.prebuilt.outputs.hit != 'true' && steps.buildx-mirror.outcome == 'failure'
      uses: docker/setup-buildx-action@v4
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    # Compose builds a service's image only when it is absent, so a build tagged
    # with the name compose expects is the image `up` then finds. The publish job
    # exports the layer cache, and every branch reads it.
    - if: inputs.docker == 'true' && steps.prebuilt.outputs.hit != 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/dev/php-fpm/Dockerfile
        tags: ${{ steps.prebuilt.outputs.tag }}
        load: true
        cache-from: type=gha

    - if: inputs.docker == 'true'
      id: compose-images
      shell: bash
      run: echo "images=$(docker compose config --images database nginx mailer mercure | xargs)" >> "$GITHUB_OUTPUT"

    - if: inputs.docker == 'true'
      uses: ./.github/actions/docker-mirror
      with:
        images: ${{ steps.compose-images.outputs.images }}

    # compose.yaml attaches to a traefik network that a workstation shares with a
    # long-running proxy. Nothing routes through it here; it only has to exist, or
    # every service referencing it fails to start.
    - if: inputs.docker == 'true'
      shell: bash
      run: |
        docker network create traefik
        docker compose up -d --wait database php-fpm

    # The bundle downloads the Tailwind binary from GitHub when it is not at
    # var/tailwind/<version>/, and one 5xx fails the job. The cache puts it there.
    # A miss still downloads once.
    - if: inputs.docker == 'true'
      id: tailwind-version
      shell: bash
      run: |
        version=$(sed -nE "s/^[[:space:]]*binary_version:[[:space:]]*'?([^'[:space:]]+)'?.*/\1/p" config/packages/symfonycasts_tailwind.yaml)
        echo "Tailwind binary version: $version"
        test "$(printf '%s\n' "$version" | grep -c .)" = 1
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - if: inputs.docker == 'true'
      uses: actions/cache@v6
      with:
        path: var/tailwind/${{ steps.tailwind-version.outputs.version }}
        key: tailwind-${{ steps.tailwind-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    # WebTestCase renders real templates, and layout_base.html.twig resolves the
    # compiled stylesheet through AssetMapper. The dev stack has a watcher
    # producing it; here it takes one explicit build.
    - if: inputs.docker == 'true'
      shell: bash
      run: docker compose exec -T php-fpm bin/console tailwind:build
