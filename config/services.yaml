# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.mailer.from_address: 'noreply@example.com'
    app.mailer.from_name: 'App'
    app.url: '%env(APP_URL)%'
    # Name of the MCP server as it appears in the connect-agent install snippet
    # and the `claude mcp add` command.
    app.mcp.server_name: 'betterplans'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# Command handlers are private services; expose them in the test container so
# KernelTestCase can fetch them directly without relying on a dependent service
# (e.g. an MCP tool) keeping them reachable.
when@test:
    services:
        App\Module\Review\Command\CreateDocumentHandler:
            autowire: true
            public: true

        App\Module\Review\Query\GetDocument:
            autowire: true
            public: true

        App\Module\Review\Query\GetReview:
            autowire: true
            public: true

        App\Module\Review\Command\ReviseDocumentHandler:
            autowire: true
            public: true

        App\Module\Review\Repository\CommentRepository:
            autowire: true
            autoconfigure: true
            public: true

        App\Module\Review\Repository\DocumentRepository:
            autowire: true
            autoconfigure: true
            public: true

        App\Module\Review\Command\AddCommentHandler:
            autowire: true
            public: true

        App\Module\Review\Service\AnchorService:
            autowire: true
            public: true

        App\Module\Review\Command\ReplyToCommentHandler:
            autowire: true
            public: true

        App\Module\Review\Command\ResolveCommentHandler:
            autowire: true
            public: true

        App\Module\Review\Command\SubmitReviewHandler:
            autowire: true
            public: true

        App\Module\SiteReview\Command\AddCommentHandler:
            autowire: true
            public: true

        App\Module\SiteReview\Command\UpdateCommentHandler:
            autowire: true
            public: true

        App\Module\SiteReview\Command\DeleteCommentHandler:
            autowire: true
            public: true

        App\Module\SiteReview\Repository\SiteReviewRepository:
            autowire: true
            public: true

        App\Module\SiteReview\Service\SiteReviewTopicBuilder:
            autowire: true
            public: true

        App\Module\SiteReview\Mcp\GetSiteReviewTool:
            autowire: true
            public: true

        App\Module\SiteReview\Mcp\AddressSiteReviewCommentsTool:
            autowire: true
            public: true
