framework:
    cache:
        # The rate limiters ride this pool — cache.rate_limiter inherits
        # cache.app — so per-IP limits are per-replica unless it is shared.
        app: cache.adapter.doctrine_dbal
        default_doctrine_dbal_provider: 'doctrine.dbal.default_connection'

when@test:
    framework:
        cache:
            # Keep this on the filesystem: dama wraps each test in one
            # transaction, so a database pool's writes would roll back with it.
            app: cache.adapter.filesystem
