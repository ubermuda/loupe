framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - App\Messenger\Middleware\AuditChannelMiddleware

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Module\Account\Messenger\GenerateDataExportMessage: async
            App\Module\Billing\Messenger\CancelSubscriptionMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

# Registered only here: the override is keyed on a client-supplied header, so in
# production any caller could force queued work inline.
when@dev:
    framework:
        messenger:
            transports:
                sync: 'sync://'

            # `middleware` does not deep-merge, so this list replaces the one
            # above outright: the audit entry has to be repeated here.
            buses:
                messenger.bus.default:
                    middleware:
                        - App\Messenger\Middleware\AuditChannelMiddleware
                        - App\Messenger\Middleware\PlaywrightSyncMiddleware

when@test:
    framework:
        messenger:
            transports:
                async:
                    dsn: 'in-memory://'
                    retry_strategy:
                        # Same retry budget as prod so retry-flow tests exercise
                        # the real number of attempts; zero delay so the
                        # in-memory transport releases retries immediately.
                        max_retries: 3
                        multiplier: 2
                        delay: 0
