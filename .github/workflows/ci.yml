name: CI

on:
  pull_request:
  push:
    branches: [main]

# Deliberately not path-filtered, unlike the docs deploy. These are required
# checks: a filtered check never reports on a pull request it skipped, and a
# pull request waiting for a report that will never arrive cannot be merged at
# all. The local documentation-only carve-out in CLAUDE.md is about a human
# waiting four minutes, which is not a cost a runner pays.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Five of the dependencies are VCS-sourced from github.com, and anonymous
  # composer gets 60 API requests an hour across the whole runner fleet.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

# One job per leg of `just ci`, rather than one job running it. A single job
# reports a single check, so a red build names the branch and nothing else —
# split, the failure names itself in the checks list and branch protection can
# require the legs individually. Each job runs the same recipe a workstation
# runs, so the two gates cannot drift.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      - run: just lint

  cs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just cs-check

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          docker: 'true'
      - run: just phpstan

  arkitect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just arkitect

  gamache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just gamache

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
          docker: 'true'
      - run: just audit

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          docker: 'true'

      # The flag rides the invocation, not the `phpunit` recipe, so a
      # workstation run still writes nothing. PHPUnit creates the directory.
      - run: just phpunit --log-junit var/phpunit-timing/junit.xml

      - name: phpunit timing
        if: always() && hashFiles('var/phpunit-timing/junit.xml') != ''
        run: php bin/phpunit-timing.php var/phpunit-timing/junit.xml

      # Every run, green or red. Read it with `just ci-report phpunit-timing`.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpunit-timing
          path: var/phpunit-timing/junit.xml
          retention-days: 30
          if-no-files-found: warn

  # Node alone: vitest runs the browser code as source, with no container and
  # no database behind it.
  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      - run: just js-test

  # The Go CLI needs neither PHP nor the project's dependencies, so this leg
  # skips the setup action and takes just alone; the recipe brings its own
  # toolchain in a container.
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just cli-test

  # Two runners, each with its own stack, database and seed. `chromium` holds
  # 191 of the 226 tests and sets the wall time; `rest` holds the one-worker
  # projects and the destructive chain that has to stay in one runner's order.
  # Neither job may be called `e2e`, because the required check of that name is
  # the fan-in job below.
  e2e-shard:
    name: e2e-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Both halves report, so one red shard still leaves the other's timing
      # and Playwright report to read.
      fail-fast: false
      matrix:
        shard: [chromium, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
          docker: 'true'

      # By name, not a bare `up`: the `tailwind` service is a watcher, and it
      # would race the stylesheet build in the setup action. The worker is not
      # needed either — every message dispatched under the X-Playwright header
      # is handled inline.
      - run: >
          docker compose -f compose.yaml -f docker/compose/ci.yaml
          up -d --wait nginx mailer mercure

      - name: Prepare the application
        run: |
          docker compose exec -T php-fpm bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          docker compose exec -T php-fpm bin/console app:dev:seed

      # Everything above runs as root in the container; php-fpm serves requests
      # as www-data, and var/ is owned by the runner. Without this the first
      # request that writes a log line dies on a 500 instead — three specs deep
      # into the suite, where it reads as an application bug.
      - name: Let php-fpm write to var/
        run: |
          mkdir -p var/log
          sudo chmod -R a+rwX var

      # The browser download is the cacheable half; --with-deps still installs
      # the system libraries, which apt keeps outside this path.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      # The runner's whole database is disposable, so the suite runs against the
      # main stack rather than the `just e2e-up` sidecar, whose only purpose is
      # to keep a developer's own database out of the way.
      - run: just e2e
        env:
          E2E_BASE_URL: http://localhost
          MAILPIT_URL: http://localhost:8025
          E2E_SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/var/e2e-timing/results.json

      - name: e2e timing
        if: always() && hashFiles('var/e2e-timing/results.json') != ''
        run: node bin/e2e-timing.mjs var/e2e-timing/results.json

      # Every run, green or red, one artifact per shard. Read them together
      # with `just ci-report e2e-timing`.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-timing-${{ matrix.shard }}
          path: var/e2e-timing/results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Application errors
        if: failure()
        run: docker compose exec -T php-fpm sh -c 'grep -hE "CRITICAL|ERROR" var/log/dev.log | tail -n 40'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7

  # The required check. It must always report, so a shard that fails, is
  # cancelled or is skipped has to reach GitHub as a red `e2e`. Without
  # `if: always()` this job is skipped when a shard fails, and a skipped
  # required check counts as satisfied, so the branch stays mergeable.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: Report the shard results
        run: |
          echo "e2e-shard: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = success
