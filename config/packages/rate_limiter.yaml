framework:
    rate_limiter:
        # Throttles write traffic on the site-review API so a leaked or scraped
        # widget token cannot be used to flood comments. Keyed per token AND
        # client address, so the allowance below is what one visitor gets on one
        # project rather than what a whole project gets.
        site_review_write:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
