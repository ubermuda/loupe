[www]
pm.max_children = 32
pm.start_servers = 12
pm.min_spare_servers = 8
pm.max_spare_servers = 20

; Held at the production default while conf.d gives the CLI 512M (memory.ini).
; A request that would die in production must die here too.
php_admin_value[memory_limit] = 128M

; One pool serves the main checkout, every worktree and the e2e sidecar, so
; "max children reached" is the signal that concurrent gates are queueing rather
; than running. Dev only: docker/common/nginx/default.conf exposes these, and
; production builds its own nginx config from docker/prod/nginx.conf.
pm.status_path = /fpm-status
ping.path = /fpm-ping
