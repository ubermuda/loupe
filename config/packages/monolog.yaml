monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            # Buffered, like test and prod: a plain debug stream here wrote
            # every doctrine query unconditionally, and the messenger worker
            # polls once a second — which grew dev.log past 600 MB and buried
            # the exceptions it was meant to surface. Errors now flush the
            # buffer with their full debug context; quiet runs write nothing.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                # The MCP endpoint answers GET with 405 by design, so without
                # this every agent handshake would flush the buffer.
                excluded_http_codes: [404, 405]
                # 'deprecation' has its own always-on handler below, so it stays
                # visible without needing an error to flush it.
                channels: ["!event", "!deprecation"]
                buffer_size: 100 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                # Render full stack traces for Throwables passed under the
                # native 'exception' context key.
                include_stacktraces: true
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.log"
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # 'cache' is handled by the always-on cache_warnings handler below;
                # excluding it here keeps the fingers_crossed buffer from swallowing
                # a cache write-failure warning that has no following error to flush it.
                channels: ["!deprecation", "!cache"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
                # Include stack traces in the JSON output for Throwables
                # passed under the native 'exception' context key. Deliberate
                # side effect: the bundle implements this by mutating the
                # handler's formatter, and 'monolog.formatter.json' is a
                # shared service also used by the 'deprecation' handler below
                # — so deprecation entries carry traces too, which is wanted
                # (a deprecation without its call site is not actionable).
                include_stacktraces: true
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Always-on (NOT behind fingers_crossed). Symfony's cache adapters log
            # write failures at WARNING on the 'cache' channel; the main handler
            # buffers warnings and only flushes on an error, so a lone cache-pool
            # write failure (which silently disables anything relying on the pool,
            # e.g. a rate limiter) would otherwise never reach stderr. This surfaces
            # it immediately.
            cache_warnings:
                type: stream
                channels: [cache]
                level: warning
                path: php://stderr
                formatter: monolog.formatter.json
