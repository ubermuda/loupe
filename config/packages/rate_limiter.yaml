framework:
    rate_limiter:
        # Throttles write traffic on the site-review API so a leaked or scraped
        # widget token cannot be used to flood comments. Keyed per token AND
        # client address, so the allowance below is what one visitor gets on one
        # project rather than what a whole project gets.
        site_review_write:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Bounds the whole MCP endpoint, not only writes: every JSON-RPC message
        # rides POST, including initialize, tools/list and ping. Keyed per token
        # alone, unlike the widget limiter above — see RateLimitMcpRequests.
        mcp_requests:
            policy: 'sliding_window'
            limit: 120
            interval: '1 minute'

        # Bounds the bridge's column reads, a GET, keyed per token alone. A
        # bridge reads each mapped project once at start.
        agent_board_columns:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Bounds the bridge's run reports, a POST, keyed per token alone. A
        # bridge reports once per finished worker, and a worker runs for minutes.
        agent_worker_runs:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Bounds failed authentications on the token firewalls, ^/api and ^/mcp,
        # because each one writes a durable audit record. A successful bearer
        # request spends nothing. Keyed per client address alone, unlike the
        # others above: the check runs before any token is resolved, and a rejected
        # token is attacker-chosen.
        api_authentication:
            policy: 'sliding_window'
            limit: 300
            interval: '1 minute'

        # Bounds subscriber-cookie renewals from open pages. A page renews once
        # before each reconnect, with backoff, so a real page stays far below
        # this. Keyed per signed-in user, because the route requires one.
        mercure_authorize:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'

# The e2e suite drives one dev instance, and PHPUnit drives one kernel, both
# from a single client address. A per-address limit therefore accumulates across
# unrelated specs. Relax it there, never in prod.
when@dev:
    framework:
        rate_limiter:
            api_authentication:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            mercure_authorize:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            api_authentication:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            mercure_authorize:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
