[supervisord]
nodaemon=true                ; keep Supervisor in foreground (PID 1)
loglevel=info
logfile_maxbytes=0             ; disable rotation

[program:php-fpm]
command          = /usr/local/sbin/php-fpm --nodaemonize
autorestart      = true
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0      ; ← disable rotation
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0      ; ← avoid stale settings
stderr_logfile_backups  = 0

[program:nginx]
command          = /usr/sbin/nginx -g 'daemon off; error_log /dev/stderr info;'
autorestart      = true
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0

; The messenger worker is intentionally NOT a program here. In prod it runs as
; its own container from this same image — the deploy config overrides the
; command with:
;   php bin/console messenger:consume scheduler_default async --time-limit=3600 --memory-limit=128M
; (scheduler_default listed first deliberately — a deep async backlog must not
; delay schedule ticks). Keeping it out of this supervisord means worker
; restarts and scaling never recycle php-fpm/nginx.
;
; Recurring background work belongs on that schedule too, never in a supervised
; sleep loop here. `app:purge-expired-exports` used to run as a `[program:]`
; block in this file because the archives sat on the web container's own disk;
; they live in the shared export storage now, so it is a `#[AsCronTask]` on the
; command and the worker runs it hourly. Adding a `[program:]` block for
; anything but php-fpm and nginx would put background work back in the
; web container's lifecycle.
