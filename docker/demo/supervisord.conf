; Supervisor for the single-container demo image only. The production web
; container uses docker/prod/supervisord.conf and must keep running php-fpm and
; nginx alone; the extra programs here are what makes one container a whole
; instance, and they are deliberately not shared with it.
[supervisord]
nodaemon=true
loglevel=info
logfile_maxbytes=0

; Started by the entrypoint too, to migrate and seed, then stopped again so the
; long-lived server is one Supervisor owns and can restart.
[program:postgres]
command          = /sbin/su-exec postgres /usr/bin/postgres -D /var/lib/postgresql/data
autorestart      = true
priority         = 10
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0

[program:php-fpm]
command          = /usr/local/sbin/php-fpm --nodaemonize
autorestart      = true
priority         = 20
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0

[program:nginx]
command          = /usr/sbin/nginx -g 'daemon off; error_log /dev/stderr info;'
autorestart      = true
priority         = 20
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0

; Without this nothing drains the queues and the failure is silent: no mail, no
; data exports, no scheduled work. su-exec drops to www-data so exports it
; writes 0600 stay readable to php-fpm, and keeps PID 1 for a clean SIGTERM.
[program:worker]
command          = /sbin/su-exec www-data php bin/console messenger:consume scheduler_default async --time-limit=3600 --memory-limit=128M
directory        = /var/www/html
autorestart      = true
priority         = 30
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0
